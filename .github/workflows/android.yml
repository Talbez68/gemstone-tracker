name: Android app

# Builds the Android app (a Trusted Web Activity around the web app) on every
# PR that touches it, and on main publishes the signed APK as the
# "android-latest" release, so the phone can always download the newest one.
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'gemstone-tracker.html', 'tests/helpers.js']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'gemstone-tracker.html', 'tests/helpers.js']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret – building a debug APK instead (see android/README.md)."
          fi

      - name: Build signed release APK
        if: steps.key.outputs.path != ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk gemstone-tracker.apk

      - name: Build debug APK
        if: steps.key.outputs.path == ''
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk gemstone-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gemstone-tracker-apk
          path: android/gemstone-tracker.apk

      - name: Publish as the android-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.key.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest gemstone-tracker.apk \
            --title "Android app (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on the phone and tap gemstone-tracker.apk to install or update." \
            --target "$GITHUB_SHA"

  # Installs that APK on an Android emulator and uses the app inside it: launch,
  # data entry, restart, photos, backup download, printing, Google sign-in, and a
  # desktop Chrome and the app sharing one (fake) Drive. See android/e2e/.
  emulator:
    name: Run the app on an Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: gemstone-tracker-apk
          path: android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/e2e/run.sh

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: android/e2e/out
