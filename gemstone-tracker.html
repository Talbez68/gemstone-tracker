/* ============================================================
   משלוח — the shipping invoice, one per trip.
   Always a single line: the trip's total carats, its total USD, and the
   fixed description "POLISHED DIAMONDS". The consignee ("To") is free text
   and the date can be corrected; the number is the app's own running one.
   ============================================================ */
const SHIP_FROM = ['MACCABI BLDG #2049 1 JABUTINSKY ST','5252001 RAMAT GAN','ISRAEL','054-3972890'];
const SHIP_LICENSE = '012470670';
const SHIP_ORIGIN  = 'ISRAEL';
const SHIP_DESC    = 'POLISHED DIAMONDS';
const SHIP_KP = 'The diamonds herein invoiced have been purchased from legitimate sources not involved in funding conflict and in compliance with united nations resolutions. The seller hereby guarantees that these diamonds are conflict free, based on personal knowledge and/or written guarantees provide by the supplier of these diamonds';

/* invoice numbers carry on from the last one issued on paper (64910 -> 64911, 64912 ...) */
const SHIP_NO_FROM = 64910;

/* The trip's invoice, issued the first time its form is opened: it takes the
   next running number and is stamped with that day's date, both kept from then
   on — a reprint next month still shows the day it was generated. */
function shipment(trip){
  const s = trip.shipment || (trip.shipment={});
  // a trip's first invoice opens with whoever he shipped to last — empty only the very first time
  if(s.to==null) s.to=state.shipTo||'';
  if(!s.number){
    const last=num(state.lastInvoiceNo);
    state.lastInvoiceNo = (last>=SHIP_NO_FROM ? last : SHIP_NO_FROM) + 1;
    s.number=String(state.lastInvoiceNo);
    s.date=today();
    save();
  }
  if(!s.date) s.date=today();
  return s;
}
function shipTotals(trip){
  let carats=0, usd=0;
  trip.vendors.forEach(v=>v.rows.filter(hasData).forEach(r=>{ carats+=num(r.weight); usd+=rowCost(r); }));
  return {carats, usd};
}
/* invoice figures always carry two decimals, and no currency sign – the column says USD */
function fmtShip(n){ return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function shipDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m ? m[3]+'-'+m[2]+'-'+m[1] : (iso||''); }
function setShipField(k,val){
  const s=shipment(activeTrip());
  s[k]=val;
  if(k==='to') state.shipTo=val;      // the next trip's invoice opens with this consignee
  debouncedSave();
}

function guideStep(n,title,body,shot,opts){
  opts=opts||{};
  const s = shot && GUIDE_IMG[shot];
  const img = s ? `<img class="guide-shot" src="${s}" alt="${title}">` : '';
  const tip = opts.tip ? `<div class="dad-tip"><img class="ava" src="${GUIDE_DAD_SRC}" alt="" onerror="dadFallback(this,'tip')"><div class="tip-body"><b>טיפ מאבא 😎</b><br>${opts.tip}</div></div>` : '';
  return `<div class="guide-step"><h3><span class="num">${n}</span>${title}</h3>${body}${img}${tip}</div>`;
}
function buildGuide(){
  $('guideView').innerHTML = `
  <div class="guide-hero">
    <div class="hero-txt">
      <h2>📖 המדריך של אבא</h2>
      <p>כל מה שצריך כדי לעבוד עם האפליקציה – בעברית פשוטה, צעד אחרי צעד. בלי אקסל, בלי כאב ראש.</p>
      <div class="relax-meter" style="margin-top:14px">
        <div class="bar"><div class="fill" style="width:15%"></div></div>

      </div>
    </div>
    <div style="text-align:center">
      <img class="dad-hero" src="${GUIDE_DAD_SRC}" alt="אבא הרגוע" onerror="dadFallback(this,'hero')">
      <div class="dad-cap">👑 הבוס בכבודו ובעצמו. מאז שיש אפליקציה – ככה הוא נראה כל היום.</div>
    </div>
  </div>

  ${guideStep(1,'מה רואים על המסך',`
    <p>המסך בנוי מ‑3 חלקים:</p>
    <ul>
      <li><b>מימין – התפריט</b> (הפס הלבן). שם כל הכפתורים: מדריך, הדפסה, גיבוי וסנכרון.</li>
      <li><b>במרכז – הטבלה</b> שבה ממלאים את האבנים.</li>
      <li>למעלה – הכותרת, ולידה הסימן ✓ נשמר שמראה שהכול נשמר אוטומטית.</li>
    </ul>
    <p>במחשב נייד או בטלפון התפריט מוסתר – פותחים אותו בכפתור <b>☰</b> שלמעלה.</p>
    <p>הכפתור הצהוב <b>📖 מדריך שימוש</b> פותח את המסך הזה, בכל רגע. לחזרה לטבלה לוחצים <b>🏠 מסך המעקב</b>.</p>
  `,'overview')}

  ${guideStep(2,'בוחרים נסיעה',`
    <p>כל נסיעה לעבודה היא טבלה נפרדת שנשמרת לתמיד. בפס הכחול בוחרים נסיעה מהרשימה, או יוצרים חדשה ב‑<b>➕ נסיעה חדשה</b>.</p>
    <ul>
      <li>ליד שם הנסיעה יש <b>תאריך</b> – משנים אותו בלחיצה. לפי התאריך מסודרת הרשימה, וכך גם היסטוריית הנסיעות.</li>
      <li><b>⧉ שכפל נסיעה</b> יוצר עותק, ושואל אם להעתיק <b>רק את שמות הספקים</b> או <b>גם את כל הנתונים</b>. נוח לפתוח נסיעה חדשה עם אותם ספקים בדיוק.</li>
      <li><b>✏️ שנה שם</b> ו‑<b>🗑️ מחק נסיעה</b> – למחיקה אין ביטול, אז כדאי ללחוץ קודם <b>💾 גיבוי הכל</b>.</li>
    </ul>
  `,'tripbar',{tip:'אני קורא לכל נסיעה בשם של העיר והחודש – "בנגקוק מרץ", "מומבאי יוני". ככה אני אף פעם לא מתבלבל.'})}

  ${guideStep(3,'הספקים – הלשוניות',`

    <p>אפשר להוסיף ספק ב‑<b>➕ ספק חדש</b> (יישאלו שם הספק וקוד), לשנות שם או למחוק. הלשונית הצהובה <b>📊 סיכום כל הספקים</b> מרכזת את כולם יחד.</p>

  ${guideStep(4,'קוד ספק וסריות אוטומטיות',`
    <p>לכל ספק יש <b>קוד</b> – שתי אותיות באנגלית שמופיעות כתווית צבעונית ליד שמו (למשל פינק = <b>PD</b>). מהקוד נוצרות <b>הסריות אוטומטית</b>: PD-01, PD-02, PD-03 וכן הלאה – מספר רץ נפרד לכל ספק.</p>
    <ul>
      <li>הספקים הקבועים כבר מגיעים עם קוד: גדי = GD, פינק = PD, מזרחי = RM, שפירא = MS.</li>
      <li>לקביעה או שינוי לוחצים <b>🏷️ קוד ספק</b>. אפשר גם למספר מחדש את כל הסריות בטבלה לפי הקוד.</li>
      <li>הקוד נשאר זהה לאותו ספק בכל נסיעה.</li>
    </ul>
  `,'overview',{tip:'אני לא כותב סריות ביד – קובע קוד פעם אחת, וכל שורה חדשה מקבלת מספר לבד. PD-01, PD-02... תענוג.'})}

  ${guideStep(5,'ממלאים שורה',`
    <p>בכל שורה ממלאים: <b>משקל, מספר אבנים, צורה, עלות לקראט</b> (ה<b>סריה</b> כבר ממולאת לבד מהקוד).</p>
    <ul>
      <li>עמודת <b>צורה</b> פותחת רשימת צורות באנגלית (Round, Oval, Pear ...).</li>
      <li>בעמודות המספרים אפשר להקליד <b>רק מספרים</b> – אם תקליד בטעות אות, תקפוץ הודעה קטנה.</li>
      <li>העמודה הכתומה <b>סה"כ עלות</b> מחושבת לבד (משקל × עלות לקראט).</li>
      <li>בעמודת <b>הערות</b> אפשר לכתוב כל דבר בחופשיות – היא מופיעה גם בסיכום ובתצוגה המהירה.</li>
      <li>למחיקת שורה בודדת לוחצים על <b>🗑</b> שבסוף השורה.</li>
    </ul>
  `,null,{tip:'אני ממלא רק משקל ועלות לקראט. את כל החשבונות האפליקציה עושה במקומי 😎'})}

  ${guideStep(6,'📷 תעודה – צילום התעודה של האבן',`
    <p>בעמודת <b>תעודה</b> אפשר לצרף <b>תמונה</b> של תעודת האבן (כמו GIA) – ישר מהטלפון.</p>
    <ul>
      <li>בתא ריק לוחצים על <b>➕</b>. בטלפון זה פותח ישר את <b>המצלמה</b> (או גלריית התמונות) – מצלמים או בוחרים תמונה, והיא נשמרת מיד.</li>
      <li>אחרי הצירוף מופיעה <b>תמונה קטנה</b> בתא. לחיצה עליה פותחת את התעודה ב<b>מסך מלא</b>, ושם אפשר גם <b>📷 להחליף</b> או <b>🗑 למחוק</b>.</li>
      <li>לא לכל אבן חייבת להיות תעודה – אפשר להשאיר את התא <b>ריק</b>.</li>
      <li>התמונות הקטנות מופיעות גם ב<b>סיכום כל הספקים</b> וב<b>תצוגה המהירה</b>.</li>
      <li>כשמחוברים ל‑Drive התמונות <b>עוברות בין המכשירים</b>: תמונה שצולמה במחשב נמשכת לטלפון בפעם הראשונה שנכנסים לשורה שלה, ואז נשמרת גם במכשיר – כך רואים אותה גם בלי אינטרנט. כל תמונה יושבת בתיקייה של הנסיעה שלה (ראו שלב 18).</li>
    </ul>
  `,null,{tip:'עכשיו התעודה של האבן ממש דבוקה אליה – לא מחפש ניירות בקלסר. צילום, וזהו.'})}

  ${guideStep(7,'הוספה וניקוי של שורות',`
    <p>צריך עוד שורות? כותבים בתיבת <b>כמות</b> כמה, ולוחצים <b>➕ הוסף שורות</b> – וכל שורה חדשה מקבלת סריה אוטומטית לפי הקוד.</p>
    <p>נשארו שורות ריקות בסוף? <b>🧹 נקה שורות ריקות</b> מסיר את כל השורות שאין בהן נתונים (שורות עם נתונים נשמרות).</p>
  `,'addrow')}

  ${guideStep(8,'הסכומים והסיכום',`
    <p>מתחת לטבלה יש כרטיסים עם <b>סה"כ עלות</b>, <b>סה"כ קראט</b> ו‑<b>סה"כ אבנים</b>. הכול מתעדכן לבד תוך כדי המילוי.</p>
    <p>הלשונית הצהובה <b>📊 סיכום כל הספקים</b> מציגה את <b>כל</b> השורות של כל הספקים ב<b>טבלה אחת</b>, עם סיכום כולל אחד בתחתית. הדף הזה כתוב <b>באנגלית</b> ומשמאל לימין – הוא זה שמוסרים ללקוח או לספק.</p>
    <p>מתחת לטבלה של כל ספק יש גם בחירת <b>מטבע</b> ($, ₪, €, £). השינוי חל על <b>כל</b> הסכומים בכל הנסיעות – חשבונית המשלוח נשארת תמיד בדולר.</p>
  `,'summary')}

  ${guideStep(9,'תצוגה מהירה (מצוין לטלפון)',`
    <p>בתפריט, מתחת ל‑<b>🏠 מסך המעקב</b>, יש <b>👁️ תצוגה מהירה</b> – מסך נוח ונקי שמראה את הנסיעה הנוכחית, מתאים במיוחד <b>לטלפון בדרכים</b>.</p>
    <p>למעלה רואים את הסכומים הגדולים (סה"כ עלות, סה"כ קראט, אבנים), ומתחת כל ספק עם הסיכום שלו וכרטיס קטן לכל אבן. בכרטיס של כל אבן רואים את ה<b>עלות לקראט</b> – בדיוק המחיר שמדברים עליו מול הספק – והסכומים הכוללים נשארים בסיכום של הספק ובכרטיסים שלמעלה. אפשר להחליף נסיעה למעלה ולראות מיד את הסיכום שלה.</p>
    <p>בפינה יש <b>📲 שמור למסך הבית</b> – מוסיף לטלפון סמל שפותח ישר את התצוגה המהירה, כמו אפליקציה רגילה. באייפון עושים זאת דרך כפתור השיתוף ⬆️ ← "הוסף למסך הבית", והאפליקציה מסבירה את זה על המסך.</p>
  `,'preview',{tip:'כשאני בדרך בין לקוחות אני פותח בטלפון את התצוגה המהירה – מבט אחד ואני יודע בדיוק איפה אני עומד.'})}

  ${guideStep(10,'היסטוריית נסיעות',`
    <p>בתפריט, מתחת ל‑<b>🏠 מסך המעקב</b>, יש <b>🧳 היסטוריית נסיעות</b>. שם רואים את <b>כל</b> הנסיעות יחד בטבלה אחת – לכל נסיעה מופיעים התאריך, מספר הספקים, מספר השורות וסה"כ העלות.</p>
    <p>בתחתית יש <b>סיכום כולל של כל הנסיעות</b> – רואים במבט אחד כמה קנית בסך הכול. לחיצה על <b>פתח</b> ליד נסיעה מחזירה אליה במסך המעקב.</p>
  `,'history',{tip:'זה המסך האהוב עליי – שורה אחת לכל נסיעה, ולמטה כמה קניתי בסך הכול. נחת.'})}

  ${guideStep(11,'סטטיסטיקת ספקים',`
    <p>בתפריט יש <b>📊 סטטיסטיקת ספקים</b> – לכל ספק, סיכום של <b>מה קנית ממנו</b> על פני <b>כל</b> הנסיעות. ככה רואים בקלות אצל מי קונים הרבה, ובאיזה מחיר.</p>
    <ul>
      <li><b>עלות כוללת</b> – כמה כסף השארת אצל הספק הזה בסך הכול.</li>
      <li><b>עלות ממוצעת לקראט</b> – המחיר הממוצע שאתה משלם לו לקראט. נוח להשוואה בין ספקים.</li>
      <li><b>סה"כ קראט</b> – כמה קראט קנית ממנו.</li>
      <li>וגם: אבנים שנקנו, סה"כ אבנים, עלות ממוצעת לאבן, ומספר הנסיעות.</li>
    </ul>
    <p>אפשר למיין לפי עלות כוללת / עלות לקראט / קראט / מספר אבנים / מספר נסיעות, ולפתוח <b>לאורך זמן</b> כדי לראות מה קנית ממנו בכל נסיעה.</p>
  `,'stats',{tip:'ככה אני רואה מי נותן לי מחיר טוב לקראט – ואצל מי אני משלם יותר. המספרים לא משקרים 😎'})}

  ${guideStep(12,'הדפסה ושמירה כ‑PDF',`
    <p>בתפריט לוחצים <b>🖨️ הדפסה / PDF</b>. נפתח חלון הדפסה – אפשר להדפיס למדפסת, או לבחור ביעד "שמירה כ‑PDF" כדי לקבל קובץ.</p>
    <p>הדף המודפס של <b>📊 סיכום כל הספקים</b> יוצא עם <b>הלוגו</b> למעלה, הטבלה באנגלית משמאל לימין, וסיכום אחד בסוף – מוכן למסור ללקוח או לספק.</p>
  `,null)}

  ${guideStep(13,'📦 משלוח – חשבונית לנסיעה',`
    <p>בתפריט יש <b>📦 משלוח</b> – חשבונית מוכנה להדפסה עבור <b>הנסיעה</b> שנבחרה למעלה, עם <b>הלוגו</b> והכתובת של החברה בראש הדף.</p>
    <ul>
      <li>בחשבונית תמיד יש <b>שורה אחת בלבד</b>: <b>סה"כ הקראט</b> ו<b>סה"כ הדולר</b> של כל הנסיעה יחד (כל הספקים), והתיאור בה הוא תמיד <b>POLISHED DIAMONDS</b>.</li>
      <li>הסכומים מתעדכנים לבד מהטבלאות – אין מה למלא ואין מה לחשב.</li>
      <li>בתיבת <b>To</b> כותבים את פרטי הנמען – <b>טקסט חופשי</b>, בכמה שורות שצריך. התיבה נפתחת עם <b>הנמען האחרון</b> שאליו שלחת, כך שאם זה אותו שליח אין מה למלא; אפשר כמובן למחוק ולכתוב אחר. מה שנכתב נשמר לאותה נסיעה, והופך לנמען שיוצע בנסיעה הבאה.</li>
      <li><b>Invoice Number</b> – <b>מספר רץ</b> שהאפליקציה נותנת לבד, אחד אחרי השני (ממשיך מהחשבוניות הקיימות: 64911, 64912 ...). כל נסיעה מקבלת מספר משלה <b>בפעם הראשונה</b> שנפתחת אצלה החשבונית, והוא נשאר שלה. אין מה למלא, ואי אפשר לשנות בטעות.</li>
      <li><b>Invoice Date</b> – התאריך שבו נוצרה החשבונית. הוא <b>לא</b> משתנה אחר כך, גם אם מדפיסים שוב בעוד חודש; אם בכל זאת צריך תאריך אחר, אפשר לשנות אותו ביד.</li>
      <li>למעלה יש בורר <b>📁 נסיעה</b> – אפשר לעבור בין נסיעות ולראות את החשבונית של כל אחת. נסיעה משוכפלת מקבלת חשבונית חדשה משלה.</li>
      <li>שאר הפרטים קבועים ומודפסים לבד: הכתובת של החברה, <b>Origin: ISRAEL</b>, נוסח היהלומים הנקיים ומספר הרישיון בתחתית.</li>
      <li>לוחצים <b>🖨️ הדפסה / PDF</b> – יוצא בדיוק הטופס, בלי התפריטים ובלי המסגרות של המסך.</li>
    </ul>
  `,null,{tip:'שורה אחת, סה"כ קראט וסה"כ דולר – בדיוק מה שהשליח צריך. מדפיס ויוצא לדרך 😎'})}

  ${guideStep(14,'שליחה במייל',`
    <p><b>📧 שלח במייל</b> פותח מייל חדש מוכן (ב‑Gmail) ובמקביל חלון לשמירת PDF. הצעדים שמופיעים על המסך: שומרים את ה‑PDF, עוברים למייל שנפתח, מצרפים אליו את הקובץ, כותבים נמען – ושולחים.</p>
  `,null)}

  ${guideStep(15,'ייבוא מאקסל ישן',`
    <p>יש נסיעות ישנות בקובץ אקסל של התבנית הישנה? <b>📥 ייבוא מאקסל ישן</b> טוען קובץ <b>.xlsx</b> ומוסיף אותו כ<b>נסיעה חדשה</b> – בלי לדרוס שום דבר קיים.</p>
    <p>הייבוא מסדר את הנתונים <b>לפי הקוד שבסריה</b>, לא לפי הלשונית שבאקסל. אם בלשונית אחת היו כמה קודים (למשל RM, RG ו־ MS באותה לשונית) – כל קוד מקבל <b>לשונית ספק משלו</b>, ששמה הוא הקוד עצמו. אפשר לשנות את השם אחרי הייבוא ב־✏️ שם.</p>
    <p>לשוניות ריקות באקסל פשוט לא מיובאות – לא נוצרות להן לשוניות ספק ריקות.</p>
  `,null)}

  ${guideStep(16,'גיבוי ושחזור ידני',`
    <p><b>💾 גיבוי הכל</b> שומר קובץ אחד עם <b>כל</b> הנסיעות והנתונים. <b>↺ שחזור גיבוי</b> טוען קובץ כזה בחזרה – ושים לב, זה <b>דורס</b> את כל מה שיש כרגע באפליקציה.</p>
    <p>כדאי ללחוץ גיבוי מדי פעם, ובמיוחד לפני שמוחקים נסיעה או ספק.</p>
  `,null,{tip:'לפני שאני מוחק משהו – קודם גיבוי. שנייה אחת, והראש שקט.'})}

  ${guideStep(17,'↩️ שחזור גרסה קודמת – רשת הביטחון',`
    <p><b>הסנכרון הוא לא גיבוי.</b> הוא שומר תמיד <b>עותק אחד – המצב הנוכחי</b>. אם נמחק משהו בטעות, המחיקה מגיעה גם לטלפון תוך שניות. בשביל זה קיים <b>↩️ שחזר גרסה קודמת</b>.</p>
    <p>האפליקציה שומרת לבד <b>גרסה אחת ליום</b>, בשני מקומות:</p>
    <ul>
      <li><b>במכשיר עצמו</b> – 14 ימים אחורה.</li>
      <li><b>ב‑Google Drive</b> – בתיקייה <b>backups</b>, 30 ימים אחורה (רק כשמחוברים לסנכרון).</li>
    </ul>
    <p>בחלון מופיעים <b>שני המקורות יחד</b>, לפי תאריך. לכן אפשר לשחזר <b>מהטלפון</b> גרסה שנשמרה במחשב – מה שלא היה אפשרי קודם.</p>
    <p>כשמחוברים ל‑Drive, השחזור <b>חל על כל המכשירים</b>: מה ששוחזר במחשב נדחף ל‑Drive והטלפון מקבל אותו. אחרת מכשיר אחד היה מחזיר בשקט את הנתונים הישנים.</p>
    <p><b>מתי נשמרת הגרסה היומית?</b> כשפותחים את האפליקציה, וגם אחרי השינוי הראשון באותו יום. פעם ביום, לא בכל לחיצה – אין מה לחכות או ללחוץ.</p>
  `,'backup',{tip:'טעיתי ומחקתי ספק שלם. שתי לחיצות – והכול חזר. גם בטלפון.'})}

  ${guideStep(18,'☁️ סנכרון בין המחשב לטלפון',`
    <p>רוצים שאותם נתונים יהיו גם במחשב וגם בטלפון? בתפריט, בקטע <b>סנכרון בענן</b>, לוחצים <b>☁️ סנכרן עם Google Drive</b> ומתחברים לחשבון Google. עושים את זה <b>פעם אחת בכל מכשיר</b>, עם <b>אותו חשבון</b> – ומאז הכול מסתנכרן לבד.</p>
    <img class="guide-shot" src="${GUIDE_IMG.driveoff}" alt="הכפתור לפני החיבור">
    <p>אחרי החיבור הקטע נראה ככה – רואים לאיזה קובץ מסתנכרנים, ויש כפתור שפותח אותו ב‑Drive:</p>
    <img class="guide-shot" src="${GUIDE_IMG.drive}" alt="הקטע אחרי החיבור">
    <p>ב‑Drive שלך נוצרת תיקייה אחת בשם <b>מעקב אבני חן</b>, והכול מסודר בתוכה לבד:</p>
    <div style="direction:ltr;text-align:left;font-family:monospace;font-size:14px;line-height:1.9;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto">
      <bdi>מעקב אבני חן</bdi>/<br>
      &nbsp;&nbsp;gemstones.json<br>
      &nbsp;&nbsp;trips/<br>
      &nbsp;&nbsp;&nbsp;&nbsp;<bdi>שם הנסיעה</bdi>/<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;certificates/
    </div>
    <p><b>gemstones.json</b> הוא הקובץ עם כל הנתונים. תחת <b>trips</b> יש תיקייה לכל נסיעה, ובתוכה <b>certificates</b> – שם יושבות תמונות התעודות של אותה נסיעה.</p>
    <p>אין מה לעשות עם זה – האפליקציה בונה ומתחזקת את המבנה לבד, וגם מעבירה תמונות ישנות למקום הנכון. אם משנים שם לנסיעה, התמונות שלה עוברות לתיקייה עם השם החדש. לא צריך לחפש כלום: אחרי החיבור מופיע בתפריט כפתור <b>📂 הצג ב‑Drive</b> שפותח את הקובץ ישירות.</p>

    <p><b>מתי הנתונים עוברים?</b> שמירה נשלחת ל‑Drive תוך שנייה‑שתיים מכל שינוי. בכיוון השני, האפליקציה בודקת אם יש חדש: <b>כל 30 שניות</b> כשהמסך פתוח, <b>בכל פעם שחוזרים אליה</b> (מעבר בין חלונות או פתיחת האפליקציה בטלפון), ובלחיצה על <b>רענן</b>.</p>
    <p>לכן אם עורכים בטלפון ומסתכלים על המחשב באותו רגע – ייתכן שיעברו כמה שניות עד שזה יופיע. אפשר תמיד ללחוץ <b>רענן</b> ולא לחכות.</p>
    <p>אם ערכתם בשני מכשירים במקביל – נשמרת <b>הגרסה האחרונה שנשמרה</b>. האפליקציה בודקת לפני כל שמירה אם יש ב‑Drive משהו חדש יותר, ואם כן – היא <b>טוענת אותו במקום לדרוס אותו</b>.</p>
    <h4 style="margin:14px 0 6px;color:var(--accent-d)">דברים שכדאי לדעת</h4>

      <li><b>חייבים לפתוח מהקישור באינטרנט</b> – לא מקובץ שהורד למחשב. בקובץ מקומי גוגל לא מרשה להתחבר, ובמקום הכפתור תופיע הודעה שמסבירה את זה.</li>

      <li><b>תמונת תעודה שצולמה במכשיר אחר</b> יורדת מ‑Drive כשנכנסים לשורה שלה. אם צולמה ממש עכשיו, ייתכן שתראו רגע קצר סימן 🖼️? עד שהיא מגיעה – זה מסתדר לבד.</li>
      <li><b>בלי אינטרנט הכול ממשיך לעבוד</b> כרגיל מהמכשיר, והשינויים נשלחים ל‑Drive כשהחיבור חוזר.</li>
      <li><b>האפליקציה רואה רק את מה שהיא יצרה</b> ב‑Drive שלך – שום קובץ אחר שלך לא נגיש לה.</li>

initSync();

/* PWA: register the service worker when served over http(s) (GitHub Pages),
   so the app works offline and auto-updates. Harmless / skipped for a local
   double-clicked file. Data lives in localStorage and is never affected. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* Ask the browser to keep this app's data and not auto-evict it under
   storage pressure. No prompt in Chrome/Edge; granted by heuristics. */
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(p=>{ if(!p) return navigator.storage.persist(); }).catch(()=>{});
}
