<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעקב אבני חן</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='52' font-size='78' text-anchor='middle' dominant-baseline='central'>💎</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7b6c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="אבני חן">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --ink:#2b2b2b; --muted:#7a7468;
    --line:#e3ddd0; --accent:#0f7b6c; --accent-d:#0a5c50;
    --gold:#b8932f; --soft:#faf8f3; --danger:#c0392b;
    --auto:#eef6f4; --hi:#fff7e6; --trip:#3d4a8a; --trip-d:#2c376b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:17px; line-height:1.4;
  }
  /* ---------- Top bar ---------- */
  header{
    background:var(--accent); color:#fff; padding:14px 20px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  header h1{font-size:22px; margin:0; font-weight:700; display:flex; align-items:center; gap:10px}
  header h1 .gem{font-size:24px}
  .toolbar{margin-right:auto; display:flex; gap:10px; flex-wrap:wrap}
  .btn{
    border:none; border-radius:10px; padding:11px 16px; font-size:16px;
    cursor:pointer; font-family:inherit; font-weight:600; transition:.12s;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn-light{background:#fff; color:var(--accent-d)}
  .btn-ghost{background:rgba(255,255,255,.18); color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.3)}
  .saved{font-size:14px; color:#d8f0eb; opacity:0; transition:.3s; white-space:nowrap}
  .saved.show{opacity:1}
  /* sync UI */
  .sync-chip{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.16);
    color:#fff; padding:7px 12px; border-radius:9px; font-size:14px; font-weight:600}
  .sync-chip b{font-weight:700}
  .btn-amber{background:var(--gold); color:#fff}

  /* ---------- Trip bar ---------- */
  .tripbar{
    background:var(--trip); color:#fff; padding:11px 20px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .tripbar .lead{font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px}
  .tripbar select{
    font-family:inherit; font-size:16px; font-weight:600; padding:8px 12px;
    border-radius:9px; border:none; background:#fff; color:var(--trip-d); min-width:230px; cursor:pointer;
  }
  .tripbar input[type=date]{
    font-family:inherit; font-size:15px; padding:7px 10px; border-radius:9px; border:none;
  }
  .tripbar .tbtns{margin-right:auto; display:flex; gap:8px; flex-wrap:wrap}
  .btn-trip{background:rgba(255,255,255,.18); color:#fff}
  .btn-trip:hover{background:rgba(255,255,255,.32)}

  /* ---------- Vendor tabs ---------- */
  .tabs{
    display:flex; align-items:center; gap:6px; padding:12px 20px 0;
    flex-wrap:wrap; background:var(--bg); position:sticky; top:0; z-index:5;
  }
  .tab{
    background:#e9e3d6; color:var(--muted); border:1px solid var(--line);
    border-bottom:none; padding:10px 18px; border-radius:12px 12px 0 0;
    cursor:pointer; font-size:16px; font-weight:600; position:relative;
  }
  .tab.active{background:var(--panel); color:var(--accent-d); box-shadow:0 -2px 6px rgba(0,0,0,.05)}
  .tab.summary{background:var(--gold); color:#fff; border-color:var(--gold)}
  .tab.summary.active{background:#9c7d28}
  .tab-add{background:transparent; border:1px dashed var(--accent); color:var(--accent);
    border-radius:10px; padding:9px 14px; cursor:pointer; font-size:15px; font-weight:600}

  /* ---------- Sheet panel ---------- */
  main{padding:0 20px 60px}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:0 12px 12px 12px;
    padding:18px; box-shadow:0 4px 14px rgba(0,0,0,.05);
  }
  .vendor-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .vendor-head h2{margin:0; font-size:24px; color:var(--accent-d)}
  .vcode-badge{display:inline-block; background:var(--gold); color:#fff; font-size:15px; font-weight:700;
    letter-spacing:.5px; padding:2px 9px; border-radius:8px; vertical-align:middle; direction:ltr}
  .vendor-head .meta{color:var(--muted); font-size:15px}
  .vendor-actions{margin-right:auto; display:flex; gap:8px}
  .btn-sm{padding:7px 12px; font-size:14px; border-radius:8px}
  .btn-outline{background:#fff; border:1px solid var(--line); color:var(--muted)}
  .btn-outline:hover{border-color:var(--accent); color:var(--accent)}
  .btn-danger{background:#fff; border:1px solid #ecc; color:var(--danger)}

  table{border-collapse:collapse; width:100%; font-size:15px}
  /* on phones the wide tables scroll horizontally inside their own box (set in the phone media query);
     on desktop .table-scroll is a plain block so the sticky header keeps working */
  th,td{border:1px solid var(--line); padding:0; text-align:center}
  thead th{
    background:var(--soft); color:var(--accent-d); font-weight:700;
    padding:9px 6px; position:sticky; top:54px; z-index:2; font-size:14px;
  }
  /* the band row labels the two halves of the table. These classes sit on the
     <th> itself, so they need th.x – as ".band-taken th" they matched nothing
     and the white text was left invisible on the header's own pale background. */
  .band th{padding:7px; font-size:14px; letter-spacing:.5px; color:var(--accent-d)}
  th.band-taken{color:var(--accent-d)}
  th.band-tools{background:var(--soft)}
  tbody td input, tbody td select{
    width:100%; border:none; background:transparent; padding:9px 6px;
    font-size:15px; font-family:inherit; text-align:center; color:var(--ink);
    outline:none;
  }
  tbody td input:focus, tbody td select:focus{background:#eef6f4; box-shadow:inset 0 0 0 2px var(--accent)}
  tbody tr:nth-child(even){background:#fbfaf6}
  tbody td.auto{background:var(--auto); font-weight:700; color:var(--accent-d); padding:9px 6px}
  td.col-num{color:var(--muted); font-weight:600; width:42px}
  th.col-stones,td.col-stones{width:54px}
  /* shape holds English words (Cushion, Marquise). The page is RTL, so a word
     wider than its field was clipped from the *start* – "Cushion" read "shion".
     A floor width keeps the whole word in view and the field itself runs LTR. */
  th.col-shape,td.col-shape{min-width:96px}
  td.col-shape input{direction:ltr}
  .sum-table td.col-shape{white-space:nowrap}
  td.col-del{width:40px}
  .del-row{background:none; border:none; cursor:pointer; color:#bbb; font-size:18px; padding:6px}
  .del-row:hover{color:var(--danger)}
  /* certificate image column */
  th.col-cert,td.col-cert{width:62px}
  .cert-cell{display:flex; align-items:center; justify-content:center; padding:5px}
  .cert-thumb{width:40px; height:40px; object-fit:cover; border-radius:6px; border:1px solid var(--line);
    cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.12); background:#fff}
  .cert-thumb:hover{border-color:var(--accent)}
  .cert-add{background:none; border:1px dashed var(--line); color:var(--muted); font-size:16px;
    width:34px; height:34px; border-radius:8px; cursor:pointer; padding:0; line-height:1}
  .cert-add:hover{border-color:var(--accent); color:var(--accent)}
  .cert-add:disabled{cursor:default; opacity:.6}
  .cert-missing{color:var(--muted); font-size:15px}
  .cert-overlay{position:fixed; inset:0; background:rgba(0,0,0,.8); display:none;
    align-items:center; justify-content:center; z-index:60; padding:20px}
  .cert-box{display:flex; flex-direction:column; gap:14px; align-items:center; max-width:96vw; max-height:92vh}
  .cert-full{max-width:96vw; max-height:78vh; object-fit:contain; border-radius:10px;
    background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .cert-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .sum-cert-thumb{width:34px; height:34px; object-fit:cover; border-radius:5px; border:1px solid var(--line); vertical-align:middle}
  input.num{direction:ltr; text-align:center}
  input.input-invalid{background:#fde8e6!important; box-shadow:inset 0 0 0 2px var(--danger)!important}
  #numToast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--danger); color:#fff; padding:13px 22px; border-radius:11px;
    font-size:17px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.28);
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; max-width:90vw; text-align:center;
  }
  #numToast.show{opacity:1}
  tfoot td{background:#f1ede3; font-weight:700; padding:11px 6px; color:var(--accent-d); font-size:16px}
  tfoot .lbl{text-align:left; color:var(--muted)}

  .add-row-bar{margin-top:14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
  .btn-add{background:var(--accent); color:#fff; font-size:17px; padding:13px 22px}
  .hint{color:var(--muted); font-size:14px}
  .row-count-wrap{display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:15px}
  .row-count{width:66px; padding:11px 8px; font-size:16px; font-family:inherit; text-align:center;
    direction:ltr; border:1px solid var(--line); border-radius:8px; background:#fff}
  .row-count:focus{outline:none; border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}

  .totals{display:flex; gap:14px; flex-wrap:wrap; margin-top:18px}
  .card{flex:1; min-width:170px; background:var(--soft); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px}
  .card .k{color:var(--muted); font-size:14px; margin-bottom:4px}
  .card .v{font-size:24px; font-weight:800; color:var(--accent-d)}

  .summary-vendor{margin-bottom:26px}
  .summary-vendor h3{margin:0 0 6px; font-size:19px; color:var(--accent-d);
    border-right:4px solid var(--gold); padding-right:10px}

  .empty{text-align:center; color:var(--muted); padding:40px 20px}

  .settings{display:flex; gap:10px; align-items:center; margin-top:18px;
    color:var(--muted); font-size:14px; flex-wrap:wrap}
  .settings select{padding:6px 10px; border-radius:8px; border:1px solid var(--line); font-family:inherit}

  details.help{margin:14px 20px 0; background:#fff; border:1px solid var(--line);
    border-radius:12px; padding:6px 16px}
  details.help summary{cursor:pointer; font-weight:700; color:var(--accent-d); padding:8px 0; font-size:16px}
  details.help ol{margin:6px 0 14px; padding-right:22px; line-height:1.7}
  details.help li b{color:var(--accent-d)}

  /* ---------- phone tweaks ---------- */
  @media (max-width:760px){
    body{font-size:16px}
    main{padding:0 10px 60px}
    .panel{padding:12px}
    /* keep the data tables readable and swipeable instead of crushed */
    .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
    .table-scroll>table{min-width:720px}
    /* inside a scroll box the sticky header would leave an empty gap – disable it here */
    .table-scroll thead th{position:static; top:auto}
    /* 16px inputs prevent iOS from auto-zooming when a field is tapped */
    tbody td input, tbody td select{font-size:16px}
    header h1{font-size:19px}
  }

  /* ---------- print ---------- */
  @media print{
    body{background:#fff; font-size:12px}
    header,.tripbar,.tabs,.toolbar,.vendor-actions,.add-row-bar,.settings,
    details.help,.del-row,.tab-add,.col-del,#numToast,
    .sidemenu,.menu-toggle,.menu-backdrop,.guide-view,
    .no-print{display:none!important}
    main{padding:0}
    .panel{border:none; box-shadow:none; border-radius:0; padding:0}
    .table-scroll{overflow:visible}
    thead th{position:static}
    th,td{border:1px solid #999}
    tbody td input,tbody td select{padding:4px 3px; font-size:12px}
    .print-only{display:block!important}
    .sum-head{margin-bottom:10px}
    .sum-logo{width:52mm}
    .totals{margin-top:12px}
    .card{border:1px solid #999}
    .summary-vendor{page-break-inside:avoid}
    /* the shipping invoice prints as the plain form it is: no card, no input boxes,
       and the date shown as text instead of a browser date picker */
    .ship-view{padding:0!important}
    .ship-doc{border:none!important; border-radius:0!important; box-shadow:none!important; padding:0!important}
    .ship-table th,.ship-table td{border:none}
    .ship-table th{border-top:1.5px solid #000; border-bottom:1.5px solid #000}
    .ship-line td{border-bottom:1px solid #000}
    .ship-to textarea{display:none!important}
    .ship-to-out{display:block!important}
    .print-val{display:inline!important}
    @page{margin:1.2cm}
  }
  .print-only{display:none}
  .print-title{text-align:center; margin-bottom:10px}
  .print-title h2{margin:0; font-size:20px}
  .print-title .d{color:#666; font-size:13px}
  /* The all-vendors summary is headed by the company logo, on screen and on paper,
     and reads left-to-right: it is the sheet handed to English-speaking buyers. */
  .sum-panel{direction:ltr}
  .sum-head{text-align:center; margin-bottom:16px}
  .sum-logo{display:block; margin:0 auto; width:270px; max-width:100%; height:auto}

  /* ---------- Layout with right-side menu ---------- */
  .layout{display:flex; align-items:flex-start}
  .contentcol{flex:1; min-width:0}
  .sidemenu{
    flex:0 0 272px; width:272px; align-self:stretch; background:var(--panel);
    border-left:1px solid var(--line); padding:18px 16px 40px; position:sticky; top:0;
    max-height:100vh; overflow:auto;
  }
  .menu-section{margin-bottom:20px}
  .menu-title{font-size:13px; color:var(--muted); font-weight:700; letter-spacing:.4px;
    margin:0 4px 8px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .menu-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:right;
    background:var(--soft); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px; font-size:16px; font-weight:600; font-family:inherit;
    color:var(--ink); cursor:pointer; transition:.12s;
  }
  .menu-item:hover{border-color:var(--accent); color:var(--accent-d); transform:translateX(-2px)}
  .menu-item.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .menu-item.guide{background:#fff7e6; border-color:var(--gold); color:#8a6a16}
  .menu-item.guide.active{background:var(--gold); color:#fff}
  #sideMenu #driveUI{display:flex; flex-direction:column; align-items:stretch; gap:8px}
  #sideMenu #driveUI .sync-chip{justify-content:center; background:var(--auto); color:var(--accent-d); border:1px solid var(--line)}
  #sideMenu #driveUI .btn{justify-content:center; width:100%; background:var(--soft); color:var(--accent-d); border:1px solid var(--line); font-size:15px}
  #sideMenu #driveUI .btn:hover{border-color:var(--accent)}
  /* restore-a-version overlay */
  .rst-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:80; align-items:center; justify-content:center; padding:18px}
  .rst-box{background:#fff; border-radius:16px; padding:22px 24px; max-width:520px; width:100%; max-height:84vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .rst-box h2{margin:0 0 8px; color:var(--accent-d); font-size:22px}
  .rst-box p{color:var(--muted); font-size:15px; margin:0 0 14px; line-height:1.6}
  .rst-list{display:flex; flex-direction:column; gap:8px}
  .rst-item{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:11px 14px}
  .rst-meta{color:var(--muted); font-size:14px}
  .rst-warn{background:#fff7e6; border:1px solid var(--gold); color:#8a6a16!important; border-radius:10px;
    padding:9px 12px; font-size:14px!important; line-height:1.5; margin:0 0 14px}
  .menu-toggle{display:inline-flex; align-items:center; background:rgba(255,255,255,.18); color:#fff; border:none;
    border-radius:9px; font-size:22px; line-height:1; padding:6px 12px; cursor:pointer}
  .menu-backdrop{display:none}
  /* collapse the docked menu at any width (handles phones that report a wide/desktop viewport) */
  body.menu-collapsed .sidemenu{display:none}
  @media (max-width:900px){
    .sidemenu{position:fixed; top:0; right:0; bottom:0; width:86vw; max-width:330px; z-index:60;
      transform:translateX(105%); transition:transform .25s; box-shadow:-6px 0 24px rgba(0,0,0,.25); border-left:none}
    body.menu-open .sidemenu{transform:translateX(0)}
    .menu-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:55}
    body.menu-open .menu-backdrop{display:block}
  }

  /* ---------- Usage guide ---------- */
  .history-view{padding:6px 4px 60px}
  .hist-table{border-collapse:collapse; width:100%; font-size:15px; margin-top:10px}
  .hist-table th,.hist-table td{border:1px solid var(--line); padding:11px 10px; text-align:center}
  .hist-table thead th{background:var(--soft); color:var(--accent-d); font-weight:700; position:static; font-size:14px}
  .hist-table tbody tr:nth-child(even){background:#fbfaf6}
  .hist-table .h-name{text-align:right; font-weight:700; color:var(--accent-d)}
  .hist-table .auto{background:var(--auto); font-weight:700; color:var(--accent-d)}
  .hist-table tr.hist-active{background:var(--hi)!important}
  .h-badge{background:var(--accent); color:#fff; font-size:11px; padding:2px 8px; border-radius:8px; font-weight:600; margin-right:6px}
  .hist-foot td{background:#f1ede3; font-weight:800; color:var(--accent-d)}
  /* summary: one combined table of all vendors */
  .sum-table{border-collapse:collapse; width:100%; font-size:15px; margin-top:6px}
  .sum-table th,.sum-table td{border:1px solid var(--line); padding:9px 8px; text-align:center}
  .sum-table thead th{background:var(--soft); color:var(--accent-d); font-weight:700; position:static; font-size:14px}
  .sum-table tbody tr:nth-child(even){background:#fbfaf6}
  .sum-table td.auto{background:var(--auto); font-weight:700; color:var(--accent-d)}
  /* friendly mobile preview */
  .preview-view{padding:6px 4px 60px; max-width:760px; margin:0 auto}
  .pv-head{margin:8px 4px 14px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
  .pv-head h2{margin:0; font-size:24px; color:var(--accent-d)}
  .pv-head .pv-trip{color:var(--muted); font-size:15px; margin-top:2px}
  .pv-install{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:11px 16px;
    font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; white-space:nowrap}
  .pv-install:hover{background:var(--accent-d)}
  .pv-trippick{display:flex; align-items:center; gap:8px; margin:0 4px 16px; color:var(--muted); font-size:15px; font-weight:600}
  .pv-tripsel{flex:1; max-width:420px; font-family:inherit; font-size:16px; font-weight:700; padding:11px 12px;
    border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--trip-d); cursor:pointer}
  .pv-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px}
  .pv-stat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center}
  .pv-stat .lbl{color:var(--muted); font-size:13px; margin-bottom:4px}
  .pv-stat .num{font-size:20px; font-weight:800; color:var(--accent-d); direction:ltr}
  .pv-vendor{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .pv-vendor-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom:8px; border-bottom:1px solid var(--line); padding-bottom:8px}
  .pv-vname{font-size:19px; font-weight:700; color:var(--accent-d)}
  .pv-vsub{color:var(--muted); font-size:14px}
  .pv-row{padding:12px 6px; border-bottom:1px solid var(--soft)}
  .pv-row:last-child{border-bottom:none}
  .pv-row .r-head{display:flex; align-items:baseline; gap:10px}
  .pv-row .r-serial{font-size:17px; font-weight:800; color:var(--ink); direction:ltr}
  .pv-row .r-grid{display:grid; grid-template-columns:1fr 1fr; gap:5px 18px; margin-top:8px}
  .pv-row .f{display:flex; justify-content:space-between; gap:10px; font-size:15px; padding:4px 2px; border-bottom:1px dashed var(--line)}
  .pv-row .f .fl{color:var(--muted)}
  .pv-row .f .fv{font-weight:700; color:var(--ink); direction:ltr; unicode-bidi:isolate}
  .pv-row .f.note{grid-column:1 / -1; display:block}
  .pv-row .f.note .fl{margin-left:6px}
  .pv-row .f.note .fv{direction:rtl; unicode-bidi:normal; font-weight:600}
  @media (max-width:380px){ .pv-row .r-grid{grid-template-columns:1fr} }
  .sum-table td.s-notes{text-align:left; color:var(--muted); font-size:14px; white-space:normal; max-width:200px}
  /* vendor statistics */
  .stats-view{padding:6px 4px 60px}
  .stats-wrap{max-width:820px; margin:0 auto}
  .st-head-main{margin:8px 4px 6px}
  .st-head-main h2{margin:0; font-size:24px; color:var(--accent-d)}
  .st-head-main .st-sub{color:var(--muted); font-size:15px; margin-top:2px}
  .st-sort{margin:0 4px 16px; color:var(--muted); font-size:15px; display:flex; align-items:center; gap:8px}
  .st-sort select{font-family:inherit; font-size:15px; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:#fff}
  .st-vendor{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .st-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
  .st-top{background:var(--gold); color:#fff; font-size:12px; font-weight:700; padding:3px 9px; border-radius:8px}
  .st-headline{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px}
  .st-grid{display:grid; grid-template-columns:1fr 1fr; gap:5px 18px; margin-bottom:8px}
  .st-grid .f{display:flex; justify-content:space-between; gap:10px; font-size:14.5px; padding:4px 2px; border-bottom:1px dashed var(--line)}
  .st-grid .f .fl{color:var(--muted)}
  .st-grid .f .fv{font-weight:700; color:var(--ink); direction:ltr; unicode-bidi:isolate}
  .st-time{margin-top:6px; font-size:14px}
  .st-time summary{cursor:pointer; color:var(--accent-d); font-weight:700; padding:4px 0}
  .st-time .tt-row{display:flex; justify-content:space-between; gap:10px; padding:6px 2px; border-bottom:1px dashed var(--line); color:var(--muted)}
  .st-time .tt-row b{color:var(--ink)}
  @media (max-width:520px){ .st-grid{grid-template-columns:1fr} }
  @media (max-width:520px){ .pv-stats{grid-template-columns:repeat(2,1fr)} .pv-head h2{font-size:22px} }
  /* ---------- משלוח – the shipping invoice, one per trip ---------- */
  .ship-view{padding:6px 4px 60px}
  .ship-wrap{max-width:900px; margin:0 auto}
  .ship-head{margin:8px 4px 6px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
  .ship-head h2{margin:0; font-size:24px; color:var(--accent-d)}
  .ship-head .st-sub{color:var(--muted); font-size:15px; margin-top:2px}
  /* the document itself: English, left-to-right, black on white — it goes to the shipper */
  .ship-doc{direction:ltr; background:#fff; color:#000; font-family:Arial,Helvetica,sans-serif;
    font-size:13px; line-height:1.4; border:1px solid var(--line); border-radius:12px;
    padding:26px 30px 34px; box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .ship-letterhead{border-top:3px solid #000; border-bottom:3px solid #000; padding:14px 0 12px; text-align:center}
  .ship-logo{display:block; margin:0 auto 8px; width:230px; max-width:70%; height:auto}
  .ship-from{font-size:12.5px; line-height:1.5}
  .ship-title{text-align:center; font-family:"Times New Roman",Georgia,serif; font-style:italic;
    font-weight:700; font-size:30px; text-decoration:underline; margin:18px 0 20px}
  .ship-parties{display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:26px}
  .ship-to{display:flex; align-items:flex-start; gap:6px; flex:1}
  .ship-to .lbl{font-weight:700; padding-top:3px; white-space:nowrap}
  /* free text: he types whatever the consignee's details happen to be */
  .ship-to textarea{flex:1; max-width:380px; min-height:92px; padding:4px 6px; border:1px solid #000;
    border-radius:0; background:#fff; color:#000; font-family:inherit; font-size:13px; font-weight:700;
    line-height:1.5; resize:none; overflow:hidden}
  /* on paper the same text is laid out as a plain block, so a long address can never be clipped */
  .ship-to-out{display:none; flex:1; max-width:380px; min-height:92px; padding:4px 6px; border:1px solid #000;
    font-size:13px; font-weight:700; line-height:1.5; white-space:pre-wrap}
  .ship-meta{width:250px}
  .ship-meta .f{display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-bottom:12px; white-space:nowrap}
  .ship-meta input{width:132px; padding:4px 6px; border:1px solid var(--line); border-radius:6px;
    background:#fff; color:#000; font-family:inherit; font-size:13px}
  .ship-num{font-weight:700}   /* issued by the app, so it is text and not a field */
  .print-val{display:none}
  .ship-table{width:100%; border-collapse:collapse; font-size:13px}
  /* plain black-on-white, unlike the app's own tables: this is a printed form */
  .ship-table th{padding:6px 6px; text-align:left; font-weight:700; white-space:nowrap;
    position:static; background:none; color:#000; font-size:13px;
    border:none; border-top:1.5px solid #000; border-bottom:1.5px solid #000}
  .ship-table td{padding:7px 6px; text-align:left; border:none}
  .ship-table tbody tr{background:none}
  .ship-table .n{text-align:right}
  .ship-line td{border-bottom:1px solid #000}
  .ship-origin td,.ship-totals td{font-family:"Times New Roman",Georgia,serif; font-weight:700; font-size:14px}
  .ship-kp{font-size:9px; line-height:1.35; margin:36px 0 0}
  .ship-sign{margin-top:54px; display:flex; justify-content:flex-end}
  .ship-sign .line{width:300px; border-top:1px solid #000; padding-top:6px; text-align:center}
  .ship-sign .who{font-family:"Times New Roman",Georgia,serif; font-style:italic; font-weight:700; font-size:15px}
  @media (max-width:640px){
    .ship-doc{padding:18px 14px 26px}
    .ship-parties{flex-direction:column; gap:14px}
    .ship-meta{width:100%}
    .ship-meta .f{justify-content:flex-start}
    .ship-to textarea{max-width:none}
    .ship-table{font-size:12px}
    .ship-table th,.ship-table td{padding:6px 3px}
    /* the form keeps its paper proportions; on a phone it swipes sideways instead of squashing */
    .ship-view .table-scroll>table{min-width:560px}
  }
  .guide-view{padding:6px 4px 60px; max-width:900px; margin:0 auto}
  .guide-hero{background:linear-gradient(135deg,#0f7b6c,#3d4a8a); color:#fff; border-radius:16px;
    padding:26px; margin:14px 0 26px; display:flex; gap:24px; align-items:center; flex-wrap:wrap;
    box-shadow:0 8px 24px rgba(0,0,0,.15)}
  .guide-hero .hero-txt{flex:1; min-width:240px}
  .guide-hero h2{margin:0 0 8px; font-size:30px}
  .guide-hero p{margin:0; font-size:17px; line-height:1.6; opacity:.96}
  .dad-hero{width:200px; height:200px; border-radius:18px; object-fit:cover; object-position:55% 12%;
    border:5px solid #fff; box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .dad-cap{font-size:14px; opacity:.92; margin-top:8px; max-width:220px}
  .relax-meter .bar{height:14px; background:rgba(255,255,255,.25); border-radius:8px; overflow:hidden}
  .relax-meter .fill{height:100%; background:var(--gold); border-radius:8px}
  .relax-meter .lbl{font-size:13px; margin-top:5px}
  .guide-step{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:20px 22px; margin-bottom:20px; box-shadow:0 3px 12px rgba(0,0,0,.05)}
  .guide-step h3{margin:0 0 10px; font-size:22px; color:var(--accent-d); display:flex; align-items:center; gap:10px}
  .guide-step .num{background:var(--accent); color:#fff; width:34px; height:34px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center; font-size:17px; flex:0 0 auto}
  .guide-step p{font-size:16.5px; line-height:1.7; margin:8px 0}
  .guide-step ul{font-size:16px; line-height:1.85; padding-right:22px; margin:8px 0}
  .guide-shot{display:block; max-width:100%; border:1px solid var(--line); border-radius:10px;
    margin:14px auto 4px; box-shadow:0 4px 14px rgba(0,0,0,.1)}
  .dad-tip{background:#fff7e6; border:1px solid var(--gold); border-radius:12px; padding:12px 14px;
    margin:14px 0 4px; display:flex; gap:12px; align-items:flex-start}
  .dad-tip .ava{width:48px; height:48px; border-radius:50%; object-fit:cover; object-position:55% 10%;
    border:2px solid var(--gold); flex:0 0 auto; background:#ffe9b8}
  .dad-tip .tip-body{flex:1; font-size:15.5px; line-height:1.6}
  .dad-tip .tip-body b{color:#8a6a16}
  .dad-fallback{display:inline-flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#ffd27a,#f5a86a); font-size:64px}
  .dad-hero.dad-fallback{width:200px; height:200px; border-radius:18px}
  .dad-tip .ava.dad-fallback{font-size:26px}
  .guide-finish{background:linear-gradient(135deg,#b8932f,#0f7b6c); color:#fff; text-align:center;
    border-radius:16px; padding:30px 24px; margin-top:10px}
  .guide-finish h3{margin:0 0 10px; font-size:26px}
  .guide-finish p{font-size:18px; margin:6px 0}

</head>

<header>
  <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()" title="פתיחת / סגירת התפריט">☰</button>
  <h1><span class="gem">💎</span> מעקב אבני חן</h1>
  <span class="saved" id="saved">✓ נשמר</span>
</header>

<div class="menu-backdrop" id="menuBackdrop" onclick="closeDrawer()"></div>
<div class="layout">
  <aside class="sidemenu" id="sideMenu">
    <div class="menu-section">
      <div class="menu-title">ניווט</div>
      <button class="menu-item active" id="navTracker" onclick="showView('tracker')">🏠 מסך המעקב</button>
      <button class="menu-item" id="navPreview" onclick="showView('preview')">👁️ תצוגה מהירה</button>
      <button class="menu-item" id="navHistory" onclick="showView('history')">🧳 היסטוריית נסיעות</button>
      <button class="menu-item" id="navStats" onclick="showView('stats')">📊 סטטיסטיקת ספקים</button>
      <button class="menu-item" id="navShip" onclick="showView('ship')">📦 משלוח</button>
      <button class="menu-item guide" id="navGuide" onclick="showView('guide')">📖 מדריך שימוש</button>
    </div>
    <div class="menu-section">
      <div class="menu-title">פעולות</div>
      <button class="menu-item" onclick="window.print()" title="הדפסת הטבלה או שמירתה כקובץ PDF. בחלון ההדפסה בוחרים את היעד 'שמירה כ‑PDF'.">🖨️ הדפסה / PDF</button>
      <button class="menu-item" onclick="emailPDF()" title="שולח את הנסיעה הנוכחית במייל: קודם שומרים PDF דרך ההדפסה, ואז נפתח מייל חדש לצרף אליו את הקובץ.">📧 שלח במייל</button>
      <button class="menu-item" onclick="backupJSON()" title="שמירת גיבוי מלא של כל הנסיעות והנתונים לקובץ אחד במחשב. כדאי לעשות מדי פעם, וגם כדי להעביר את הכול למחשב אחר.">💾 גיבוי הכל</button>
      <label class="menu-item" style="cursor:pointer" title="טעינת קובץ גיבוי שנשמר קודם. שימו לב: הפעולה דורסת את כל הנתונים הקיימים כעת באפליקציה.">↺ שחזור גיבוי
        <input type="file" accept=".json" onchange="restoreJSON(event)" style="display:none">
      </label>
      <label class="menu-item" style="cursor:pointer" title="ייבוא נסיעה ישנה מקובץ אקסל (.xlsx) של התבנית הישנה. נוספת כנסיעה חדשה בלי לדרוס כלום.">📥 ייבוא מאקסל ישן
        <input type="file" accept=".xlsx" onchange="importXLSX(event)" style="display:none">
      </label>
    </div>
    <div class="menu-section">
      <div class="menu-title">גיבוי אוטומטי</div>
      <button class="menu-item" onclick="openRestore()" title="שחזור גרסה קודמת של הנתונים. האפליקציה שומרת אוטומטית גרסה ליום (בתוך הדפדפן), כדי שאפשר יהיה לחזור אחורה אם נמחק משהו בטעות.">↩️ שחזר גרסה קודמת</button>
    </div>
    <div class="menu-section">
      <div class="menu-title">סנכרון בענן</div>
      <span id="driveUI"></span>
    </div>
  </aside>

  <div class="contentcol">
    <!-- Trip / business-travel selector -->
    <div class="tripbar">
      <span class="lead">📁 נסיעה:</span>
      <select id="tripSelect" title="בחירת הנסיעה שמוצגת כעת. כל נסיעה היא נפרדת ונשמרת לתמיד."></select>
      <input type="date" id="tripDate" title="תאריך הנסיעה">
      <div class="tbtns">
        <button class="btn btn-sm btn-trip" onclick="addTrip()" title="פתיחת נסיעה חדשה וריקה, עם ספקי ברירת המחדל.">➕ נסיעה חדשה</button>
        <button class="btn btn-sm btn-trip" onclick="duplicateTrip()" title="יצירת עותק של הנסיעה הנוכחית – אפשר להעתיק רק את שמות הספקים, או גם את כל הנתונים.">⧉ שכפל נסיעה</button>
        <button class="btn btn-sm btn-trip" onclick="renameTrip()" title="שינוי השם של הנסיעה הנוכחית.">✏️ שנה שם</button>
        <button class="btn btn-sm btn-trip" onclick="deleteTrip()" title="מחיקת הנסיעה הנוכחית וכל הנתונים שבה. אי אפשר לבטל – כדאי קודם ללחוץ 'גיבוי הכל'.">🗑️ מחק נסיעה</button>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
    <main id="main"></main>
    <section class="preview-view" id="previewView" style="display:none"></section>
    <section class="stats-view" id="statsView" style="display:none"></section>
    <section class="ship-view" id="shipView" style="display:none"></section>
    <section class="history-view" id="historyView" style="display:none"></section>
    <section class="guide-view" id="guideView" style="display:none"></section>
  </div>
</div>

const SHAPES = ['Round','Oval','Pear','Marquise','Emerald','Cushion','Princess','Radiant','Asscher','Heart','Trillion','Baguette','Rough'];

const COL_CLASS = {stones:'col-stones', cert:'col-cert', shape:'col-shape'};

const COLS = [
  {key:'serial', label:'סריה',         type:'text'},
  {key:'weight', label:'משקל',         type:'num'},
  {key:'stones', label:'מספר אבנים',    type:'int'},
  {key:'shape',  label:'צורה',          type:'shape'},
  {key:'cost',   label:'עלות לקראט',    type:'num'},
  {key:'totCost',label:'סה"כ עלות',     type:'auto'},
  {key:'cert',   label:'תעודה',         type:'certimg'},
  {key:'notes',  label:'הערות',         type:'text'},
];

let state = load();

/* ---------- model ---------- */
function rid(p){ return p+Math.random().toString(36).slice(2,9); }
function blankRow(){ return {serial:'',weight:'',stones:'',shape:'',cost:'',cert:'',notes:''}; }
function newVendor(name, code=''){ const r=blankRow(); if(code) r.serial=makeSerial(code,1); return {id:rid('v'), name, code, rows:[r]}; }
/* ---- vendor codes & auto-serials (CODE-01, CODE-02 ...) ---- */
function vendorCode(v){ return ((v&&v.code) || (state&&state.vendorCodes&&state.vendorCodes[v.name]) || '').toUpperCase(); }
function makeSerial(code,n){ return code+'-'+String(n).padStart(2,'0'); }
function nextSerialNum(v){
  const code=vendorCode(v); if(!code) return 1;
  const re=new RegExp('^'+code+'-0*(\\d+)$','i'); let mx=0;
  v.rows.forEach(r=>{ const m=(r.serial||'').trim().match(re); if(m){ const n=parseInt(m[1],10); if(n>mx) mx=n; } });
  return mx+1;
}
/* seed a fresh/duplicated trip's default vendors with their remembered codes */
function applyVendorCodes(t){
  const map=(state&&state.vendorCodes)||{};
  t.vendors.forEach(v=>{ const c=v.code||map[v.name]; if(!c) return; v.code=c;
    v.rows.forEach((r,i)=>{ if(!r.serial) r.serial=makeSerial(c,i+1); }); });
}
function newTrip(name){
  const t={id:rid('t'), name, date:today(), activeId:null,
    vendors:[newVendor('גדי','GD'),newVendor('פינק','PD'),newVendor('מזרחי','RM'),newVendor('שפירא','MS')]};
  t.activeId=t.vendors[0].id; return t;
}
function defaultState(){
  const t=newTrip('נסיעה ראשונה');
  return {currency:'$', activeTripId:t.id, trips:[t]};
}

/* cert now holds an image filename (cert_xxx.jpg); scrub any legacy text value (e.g. "GIA") */
/* Excel keeps 2.03 as 2.0299999999999998 - strip that binary-float noise */
function cleanNum(v){ const n=parseFloat(v); return isFinite(n)&&n?String(Number(n.toPrecision(12))):''; }
function migrateRows(s){
  (s.trips||[]).forEach(t=>(t.vendors||[]).forEach(v=>(v.rows||[]).forEach(r=>{
    if(r.cert && !/^cert_/.test(r.cert)) r.cert='';
    // only touch values that carry float noise, never something he typed himself
    ['weight','stones','cost'].forEach(k=>{ if(/\d{9,}/.test(r[k]||'')) r[k]=cleanNum(r[k]); });
  })));
  return s;
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(s && s.trips){ if(!s.activeTripId) s.activeTripId=s.trips[0]?.id; return migrateRows(s); }
  }catch(e){}
  // migrate v1 (single workbook, no trips)
  try{
    const old=JSON.parse(localStorage.getItem('gemstone-tracker-v1'));
    if(old && old.vendors){
      const t={id:rid('t'),name:'נסיעה מיובאת',date:today(),activeId:old.activeId,vendors:old.vendors};
      if(!t.activeId||t.activeId==='__summary__') t.activeId=t.vendors[0]?.id;
      return {currency:old.currency||'$', activeTripId:t.id, trips:[t]};
    }
  }catch(e){}
  return defaultState();
}
let saveTimer=null;
function save(){
  state.savedAt=new Date().toISOString();      // whose copy is newer, for cloud sync
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const el=$('saved'); el.classList.add('show');
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>el.classList.remove('show'),1200);
  scheduleDrivePush();      // mirror to Google Drive, if connected
  scheduleSnapshot();       // rolling daily snapshots (+ off-device backup folder)
}

/* ---------- helpers ---------- */
const $ = id=>document.getElementById(id);
const cur = ()=>state.currency;
function num(v){ const n=parseFloat(v); return isFinite(n)?n:0; }
function fmtMoney(n){ return cur()+' '+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function fmtNum(n){ return (Math.round(n*1000)/1000).toLocaleString('en-US'); }
function rowCost(r){ return num(r.weight)*num(r.cost); }
function activeTrip(){ return state.trips.find(t=>t.id===state.activeTripId) || state.trips[0]; }
function activeVendor(){ const t=activeTrip(); return t.vendors.find(v=>v.id===t.activeId); }
function tripLabel(t){ return t.name + (t.date? '  ('+t.date+')':''); }

/* ============================================================
   RENDER
   ============================================================ */
function render(){ renderTripBar(); renderTabs(); renderMain(); }

function renderTripBar(){
  const sel=$('tripSelect'); sel.innerHTML='';
  const sorted=[...state.trips].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  sorted.forEach(t=>{
    const o=document.createElement('option'); o.value=t.id; o.textContent=tripLabel(t);
    if(t.id===state.activeTripId) o.selected=true; sel.appendChild(o);
  });
  sel.onchange=()=>{ state.activeTripId=sel.value; save(); render(); if(currentView!=='tracker') showView(currentView); };
  const t=activeTrip();
  const dt=$('tripDate'); dt.value=t.date||'';
  dt.onchange=()=>{ t.date=dt.value; save(); renderTripBar(); };
}

function renderTabs(){
  const t=$('tabs'); t.innerHTML=''; const trip=activeTrip();
  trip.vendors.forEach(v=>{
    const b=document.createElement('button');
    b.className='tab'+(v.id===trip.activeId?' active':'');
    b.textContent=v.name;
    b.title='פתיחת הטבלה של הספק "'+v.name+'".';
    b.onclick=()=>{ trip.activeId=v.id; save(); render(); };
    t.appendChild(b);
  });
  const add=document.createElement('button');
  add.className='tab-add'; add.textContent='➕ ספק חדש';
  add.title='הוספת לשונית של ספק חדש לנסיעה הנוכחית.';
  add.onclick=addVendor; t.appendChild(add);

  const sum=document.createElement('button');
  sum.className='tab summary'+(trip.activeId==='__summary__'?' active':'');
  sum.textContent='📊 סיכום כל הספקים'; sum.style.marginRight='auto';
  sum.title='תצוגת סיכום שמרכזת את כל הספקים יחד – כמו הגיליון "Main" באקסל.';
  sum.onclick=()=>{ trip.activeId='__summary__'; save(); render(); };
  t.appendChild(sum);
}

function renderMain(){
  const m=$('main'); const trip=activeTrip();
  if(trip.activeId==='__summary__'){ m.innerHTML=''; m.appendChild(buildSummary(trip)); return; }
  let v=activeVendor();
  if(!v){ trip.activeId=trip.vendors[0]?.id; v=activeVendor(); }
  m.innerHTML=''; m.appendChild(buildVendor(trip,v));
}

/* ----- vendor sheet ----- */
function buildVendor(trip,v){
  const wrap=document.createElement('div'); wrap.className='panel';

  const pt=document.createElement('div'); pt.className='print-only print-title';
  pt.innerHTML=`<h2>💎 ${escapeHtml(v.name)}</h2><div class="d">${escapeHtml(tripLabel(trip))}</div>`;
  wrap.appendChild(pt);

  const head=document.createElement('div'); head.className='vendor-head';
  const code=vendorCode(v);
  const badge=code ? `<span class="vcode-badge" title="קוד הספק – ממנו נוצרות הסריות אוטומטית">${escapeHtml(code)}</span>` : '';
  head.innerHTML=`<h2>${escapeHtml(v.name)} ${badge}</h2><span class="meta">${v.rows.length} שורות</span>`;
  const act=document.createElement('div'); act.className='vendor-actions';
  act.innerHTML=`
    <button class="btn btn-sm btn-outline" onclick="setVendorCode('${v.id}')" title="קוד הספק (2 אותיות באנגלית, למשל PD). ממנו נוצרות הסריות אוטומטית: PD-01, PD-02 ...">🏷️ ${code?'קוד: '+escapeHtml(code):'קבע קוד ספק'}</button>
    <button class="btn btn-sm btn-outline" onclick="renameVendor('${v.id}')" title="שינוי שם הספק.">✏️ שנה שם</button>
    <button class="btn btn-sm btn-danger" onclick="deleteVendor('${v.id}')" title="מחיקת הספק וכל השורות שלו. אי אפשר לבטל.">🗑️ מחק ספק</button>`;
  head.appendChild(act); wrap.appendChild(head);

  const table=document.createElement('table');
  table.innerHTML=headerHTML();
  const tb=document.createElement('tbody');
  v.rows.forEach((r,i)=>tb.appendChild(buildRow(v,r,i)));
  table.appendChild(tb); table.appendChild(footerHTML(v));
  const sc=document.createElement('div'); sc.className='table-scroll'; sc.appendChild(table); wrap.appendChild(sc);

  const bar=document.createElement('div'); bar.className='add-row-bar';
  const addBtn=document.createElement('button'); addBtn.className='btn btn-add'; addBtn.textContent='➕ הוסף שורות';
  addBtn.title='הוספת שורות ריקות חדשות לתחתית הטבלה. בתיבת "כמות" בוחרים כמה שורות יתווספו בלחיצה.';
  const countWrap=document.createElement('label'); countWrap.className='row-count-wrap'; countWrap.textContent='כמות: ';
  const countInp=document.createElement('input');
  countInp.type='number'; countInp.min='1'; countInp.max='100'; countInp.step='1'; countInp.value='1';
  countInp.className='row-count'; countInp.title='כמה שורות להוסיף בלחיצה אחת (1 עד 100).';
  countWrap.appendChild(countInp);
  const addRows=()=>{
    let n=parseInt(countInp.value,10);
    if(!isFinite(n)||n<1) n=1; if(n>100) n=100;
    const code=vendorCode(v); let seq=nextSerialNum(v);
    for(let i=0;i<n;i++){ const row=blankRow(); if(code) row.serial=makeSerial(code,seq++); v.rows.push(row); }
    save(); renderMain();
  };
  addBtn.onclick=addRows;
  countInp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); addRows(); } };
  bar.appendChild(addBtn); bar.appendChild(countWrap);
  const clearBtn=document.createElement('button'); clearBtn.className='btn btn-sm btn-outline'; clearBtn.textContent='🧹 נקה שורות ריקות';
  clearBtn.title='מסיר את כל השורות הריקות (ללא משקל / מספר אבנים / צורה / עלות / הערות). שורות עם נתונים נשמרות.';
  clearBtn.onclick=()=>{
    const keep=v.rows.filter(hasData);
    const removed=v.rows.length-keep.length;
    if(removed===0){ alert('אין שורות ריקות להסרה.'); return; }
    if(!confirm('להסיר '+removed+' שורות ריקות? שורות עם נתונים יישארו.')) return;
    v.rows = keep.length ? keep : [blankRow()];
    save(); renderMain();
  };
  bar.appendChild(clearBtn);
  bar.insertAdjacentHTML('beforeend','<span class="hint">טיפ: צריך רק למלא משקל ועלות לקראט – הסה"כ מחושב לבד.</span>');
  wrap.appendChild(bar);

  wrap.appendChild(totalsCards(v));

  const set=document.createElement('div'); set.className='settings'; set.innerHTML='מטבע: ';
  const sel=document.createElement('select');
  sel.title='בחירת מטבע התצוגה. משפיע על כל הסכומים בכל הנסיעות.';
  ['$','₪','€','£'].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;if(c===state.currency)o.selected=true;sel.appendChild(o);});
  sel.onchange=()=>{ state.currency=sel.value; save(); renderMain(); };
  set.appendChild(sel); wrap.appendChild(set);
  return wrap;
}

function buildRow(v,r,i){
  const tr=document.createElement('tr');
  const tdNum=document.createElement('td'); tdNum.className='col-num'; tdNum.textContent=i+1; tr.appendChild(tdNum);

  COLS.forEach(c=>{
    const td=document.createElement('td');
    if(c.type==='auto'){
      td.className='auto'; td.dataset.auto=c.key;
      td.textContent=fmtMoney(rowCost(r));
    }else if(c.type==='shape'){
      const inp=document.createElement('input'); inp.setAttribute('list','shapes');
      inp.value=r.shape||''; inp.placeholder='—';
      inp.oninput=()=>{ r.shape=inp.value; debouncedSave(); }; td.appendChild(inp);
    }else if(c.type==='certimg'){
      td.appendChild(certCell(r,tr));
    }else{
      const inp=document.createElement('input'); inp.value=r[c.key]??'';
      const numKind=VALIDATED_NUM[c.key];          // 'num' (decimal) | 'int' | undefined
      if(c.type==='num'||c.type==='int'){ inp.className='num'; inp.inputMode=c.type==='int'?'numeric':'decimal'; }
      if(numKind) inp._last=inp.value;
      inp.oninput=()=>{
        if(numKind){
          const ok=(numKind==='int'?/^\d*$/:/^\d*\.?\d*$/).test(inp.value);
          if(!ok){ inp.value=inp._last||''; flashInvalid(inp); showNumError(numKind); return; }
          inp._last=inp.value; inp.classList.remove('input-invalid');
        }
        r[c.key]=inp.value;
        if(c.key==='weight'||c.key==='cost') updateAutoCells(tr,r,v);
        debouncedSave();
      };
      td.appendChild(inp);
    }
    const cls=COL_CLASS[c.key]; if(cls) td.className=(td.className+' '+cls).trim();
    tr.appendChild(td);
  });

  const tdDel=document.createElement('td'); tdDel.className='col-del';
  const del=document.createElement('button'); del.className='del-row'; del.title='מחיקת השורה הזו מהטבלה.'; del.textContent='🗑';
  del.onclick=()=>{ if(r.cert) deleteCertImage(r.cert); if(v.rows.length===1){ v.rows[0]=blankRow(); } else { v.rows.splice(i,1); } save(); renderMain(); };
  tdDel.appendChild(del); tr.appendChild(tdDel);
  return tr;
}

/* ============================================================
   IMPORT an old Excel (.xlsx) travel — zero dependencies.
   .xlsx is a ZIP of XML; we read the central directory, inflate
   entries with the browser's DecompressionStream, and parse the
   worksheets. Adds the file as a new trip (never overwrites).
   ============================================================ */
function zipIndex(buf){
  const dv=new DataView(buf.buffer); let eocd=-1;
  for(let i=buf.length-22; i>=0 && i>buf.length-22-65536; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('not-zip');
  const cdOff=dv.getUint32(eocd+16,true), count=dv.getUint16(eocd+10,true);
  const td=new TextDecoder('utf-8'), entries={}; let p=cdOff;
  for(let n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), commentLen=dv.getUint16(p+32,true);
    const localOff=dv.getUint32(p+42,true);
    const name=td.decode(buf.subarray(p+46,p+46+nameLen));
    entries[name]={method,compSize,localOff}; p+=46+nameLen+extraLen+commentLen;
  }
  return {dv,buf,entries};
}
async function zipRead(zip,name){
  const e=zip.entries[name]; if(!e) return null;
  const {dv,buf}=zip, lh=e.localOff;
  if(dv.getUint32(lh,true)!==0x04034b50) throw new Error('bad-local');
  const nameLen=dv.getUint16(lh+26,true), extraLen=dv.getUint16(lh+28,true);
  const start=lh+30+nameLen+extraLen, comp=buf.subarray(start,start+e.compSize);
  if(e.method===0) return comp;
  if(e.method===8){
    const s=new Blob([comp]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  throw new Error('zip-method-'+e.method);
}
const VENDOR_HE={elul:'אלול',pink:'פינק',gemesis:'גמסיס',gemsis:'גמסיס',eran:'ערן'};
function cellText(c,ss){
  const t=c.getAttribute('t');
  if(t==='inlineStr'){ const tt=c.getElementsByTagName('t')[0]; return tt?tt.textContent:''; }
  const v=c.getElementsByTagName('v')[0]; if(!v) return '';
  const raw=v.textContent;
  if(t==='s') return ss[parseInt(raw,10)]||'';
  if(t==='b') return raw==='1'?'TRUE':'';
  return raw;
}

/* ---- one vendor = one code ----------------------------------------
   An old sheet often mixes several codes (his "Gemesis" tab holds RM,
   RG, DN, YS and MS). Each code becomes its own vendor tab, named
   after the code; rows with no code stay under the sheet's own name. */
/* "RM-01" / "rm 1" / "RM01" -> "RM";  a serial without a code -> "" */
function serialCode(s){ const m=String(s||'').trim().match(/^([A-Za-z]{1,4})[\s\-\u2013\u2014_.\/]*\d/); return m?m[1].toUpperCase():''; }
/* split a sheet's rows into one bucket per code, keeping the original order */
function groupRowsByCode(rows){
  const order=[], by=Object.create(null);
  rows.forEach(r=>{ const c=serialCode(r.serial); if(!by[c]){ by[c]=[]; order.push(c); } by[c].push(r); });
  const codes=order.filter(Boolean);
  // a single code (or none at all) stays one vendor - rows with no serial belong to it
  if(codes.length<2) return [{code:codes[0]||'', rows:rows.slice()}];
  return order.map(c=>({code:c, rows:by[c]}));
}
/* sheets -> the vendors to create: one per code, merged when two sheets share a code */
function planImportVendors(sheets){
  const out=[], seen=Object.create(null);
  sheets.forEach(s=>s.groups.forEach(g=>{
    const key=g.code?'c:'+g.code:'s:'+s.sheet;            // uncoded rows never merge across sheets
    if(seen[key]!==undefined){ out[seen[key]].rows=out[seen[key]].rows.concat(g.rows); return; }
    seen[key]=out.length; out.push({name:g.code||s.sheet, code:g.code, rows:g.rows.slice()});
  }));
  return out;
}
async function importXLSX(ev){
  const file=ev.target.files[0]; ev.target.value=''; if(!file) return;
  if(!window.DecompressionStream){ alert('הדפדפן הזה לא תומך בייבוא. נסו ב‑Chrome או Edge מעודכנים.'); return; }
  try{
    const zip=zipIndex(new Uint8Array(await file.arrayBuffer()));
    const td=new TextDecoder('utf-8');
    const xml=async n=>{ const b=await zipRead(zip,n); return b?new DOMParser().parseFromString(td.decode(b),'application/xml'):null; };
    const ssDoc=await xml('xl/sharedStrings.xml');
    const ss=ssDoc?[...ssDoc.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
    const wb=await xml('xl/workbook.xml'); const rels=await xml('xl/_rels/workbook.xml.rels');
    if(!wb||!rels) throw new Error('no-workbook');
    const relMap={}; [...rels.getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
    const sheets=[...wb.getElementsByTagName('sheet')].map(s=>({name:s.getAttribute('name'),
      rid:s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')}));
    const found=[];
    for(const sh of sheets){
      if(/^(main|סיכום|summary)/i.test(sh.name.trim())) continue;     // skip the summary sheet
      let tgt=relMap[sh.rid]; if(!tgt) continue;
      tgt=tgt.replace(/^\/?xl\//,'').replace(/^\//,''); const wsDoc=await xml('xl/'+tgt);
      if(!wsDoc) continue;
      // build rows -> {colLetter: text}
      const rows=[...wsDoc.getElementsByTagName('row')].map(r=>{
        const m={}; [...r.getElementsByTagName('c')].forEach(c=>{ const ref=c.getAttribute('r')||''; m[ref.replace(/[0-9]/g,'')]=cellText(c,ss); }); return m;
      });
      // find header row (contains מספר + סריה), map label -> column letter
      let col=null;
      for(const m of rows){ const vals=Object.values(m);
        if(vals.includes('מספר')&&vals.includes('סריה')){ col={}; for(const k in m) col[m[k].trim()]=k; break; } }
      if(!col) continue;
      const get=(m,label)=>{ const k=col[label]; return k?(m[k]||'').trim():''; };
      const headerLabels=Object.keys(col);
      const dataRows=[];
      let seenHeader=false;
      for(const m of rows){
        const vals=Object.values(m).map(x=>x.trim());
        if(!seenHeader){ if(vals.includes('מספר')&&vals.includes('סריה')) seenHeader=true; continue; }
        // an old file may still carry מכירה לקראט / נמכר columns; they are simply ignored
        const weight=get(m,'משקל'),stones=get(m,'מספר אבנים'),shape=get(m,'צורה'),
          cost=get(m,'עלות לקראט'),notes=get(m,'הערות'),serial=get(m,'סריה');
        const real=[weight,stones,cost].some(v=>parseFloat(v)>0);   // a real entry has numeric data
        if(!real) continue;
        dataRows.push({serial,weight:cleanNum(weight),stones:cleanNum(stones),
          shape,cost:cleanNum(cost),cert:'',notes:notes==='0'?'':notes});
      }
      if(!dataRows.length) continue;                                   // empty tab -> no vendor tab
      const vname=VENDOR_HE[sh.name.trim().toLowerCase()]||sh.name.trim();
      found.push({sheet:vname, groups:groupRowsByCode(dataRows)});
    }
    if(!found.length){ alert('לא נמצאו לשוניות ספקים עם נתונים בקובץ.'); return; }

    // one vendor tab per code, named after the code (RM, RG, DN ...)
    const vendors=planImportVendors(found).map(g=>{
      const v={id:rid('v'), name:g.name, rows:g.rows};
      if(/^[A-Z]{2}$/.test(g.code)) v.code=g.code;
      return v;
    });

    const base=file.name.replace(/\.xlsx$/i,'');
    const name=prompt('שם הנסיעה המיובאת:', base||'נסיעה מיובאת'); if(name===null) return;
    const t={id:rid('t'),name:name.trim()||base||'נסיעה מיובאת',date:today(),activeId:vendors[0].id,vendors};
    state.trips.push(t); state.activeTripId=t.id; save(); render(); showView('tracker');
    const totalRows=vendors.reduce((s,v)=>s+v.rows.filter(hasData).length,0);
    alert('יובאה נסיעה "'+t.name+'" עם '+vendors.length+' ספקים ו‑'+totalRows+' שורות נתונים ✓');
  }catch(e){ alert('הקובץ אינו תבנית אקסל נתמכת. ודאו שזהו קובץ .xlsx של התבנית הישנה.\n('+(e&&e.message||e)+')'); }
}

/* ============================================================
   LOCAL STORES — IndexedDB backs the certificate photos, the daily
   snapshots, and the small key/value bag the Drive sync keeps its
   file id and token in. localStorage stays the primary copy of the
   data itself.
   ============================================================ */

function idbDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open('gem-sync',3);
  r.onupgradeneeded=()=>{ const db=r.result;
    if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    if(!db.objectStoreNames.contains('snaps')) db.createObjectStore('snaps',{keyPath:'day'});
    if(!db.objectStoreNames.contains('certs')) db.createObjectStore('certs'); };   // key: filename, value: image Blob
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function certImgPut(name,blob){ const db=await idbDB(); return new Promise((res,rej)=>{ const t=db.transaction('certs','readwrite');
  t.objectStore('certs').put(blob,name); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function certImgGet(name){ const db=await idbDB(); return new Promise((res,rej)=>{ const t=db.transaction('certs','readonly');
  const rq=t.objectStore('certs').get(name); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function certImgDel(name){ const db=await idbDB(); return new Promise((res,rej)=>{ const t=db.transaction('certs','readwrite');
  t.objectStore('certs').delete(name); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }

/* ============================================================
   CERTIFICATE IMAGES
   The bytes never touch localStorage/state (which only holds the
   filename). Two layers: IndexedDB = fast local cache + offline;
   Google Drive = durable + shared with his other devices.
   ============================================================ */
const CERT_MAXEDGE=1800, CERT_QUALITY=0.8;
const _certURLs={};                       // filename -> objectURL, cached for this session

async function compressImage(file){
  const bmp=await createImageBitmap(file);
  let w=bmp.width, h=bmp.height;
  const scale=Math.min(1, CERT_MAXEDGE/Math.max(w,h));    // only shrink, never upscale
  w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h); if(bmp.close) bmp.close();
  const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',CERT_QUALITY));
  return blob||file;
}
async function saveCertImage(file){
  const blob=await compressImage(file).catch(()=>file);
  const name='cert_'+rid('').slice(0,10)+'.jpg';
  await certImgPut(name,blob);                            // local cache – always
  driveCertUpload(name,blob,activeTrip()).catch(()=>{});  // + Google Drive, so every device gets it
  return name;
}
async function certBlob(name){
  if(!name) return null;
  let b=await certImgGet(name).catch(()=>null);           // local first
  if(b) return b;
  b=await driveCertDownload(name).catch(()=>null);        // else fetch it from Google Drive (another device took it)
  if(b){ certImgPut(name,b).catch(()=>{}); return b; }
  return null;
}
async function certURL(name){
  if(!name) return null;
  if(_certURLs[name]) return _certURLs[name];
  const b=await certBlob(name); if(!b) return null;
  return (_certURLs[name]=URL.createObjectURL(b));
}
async function deleteCertImage(name){
  if(!name) return;
  if(_certURLs[name]){ URL.revokeObjectURL(_certURLs[name]); delete _certURLs[name]; }
  await certImgDel(name).catch(()=>{});
  driveCertDelete(name).catch(()=>{});
}

const SNAP_KEEP=14, DRIVE_BACKUP_KEEP=30;

async function saveSnapshot(){
  try{

    const all=await snapAll();
    if(all.length>SNAP_KEEP){ all.sort((a,b)=>a.day.localeCompare(b.day));
      for(const r of all.slice(0,all.length-SNAP_KEEP)) await snapDel(r.day); }

async function driveFetch(url,opts,retry){
  if(!driveToken||Date.now()>driveTokenExp) await driveAuth(false);
  const o=Object.assign({},opts); o.headers=Object.assign({Authorization:'Bearer '+driveToken},(opts&&opts.headers)||{});
  const r=await fetch(url,o);
  if(r.status===401&&!retry){ driveToken=null; idbDel('driveTok').catch(()=>{}); return driveFetch(url,opts,true); }
  if(!r.ok) throw new Error('drive-'+r.status);
  return r;
}
/* the file body: the state plus who wrote it and when */
function drivePayload(){ return JSON.stringify({app:'gemstone-tracker', savedAt:state.savedAt||new Date().toISOString(), state}, null, 2); }
function driveUnwrap(txt){
  const j=JSON.parse(txt);
  const s=j&&j.state?j.state:j;                       // also reads a plain state file from the old sync
  if(!s||!s.trips) return null;
  if(!s.savedAt) s.savedAt=(j&&j.savedAt)||'';
  return s;
}
async function driveFindFile(){
  const q=encodeURIComponent("name='"+DRIVE_FILENAME+"' and trashed=false");
  const r=await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=drive&orderBy=modifiedTime desc&fields=files(id,modifiedTime,webViewLink)&q='+q);
  const j=await r.json();
  return (j.files&&j.files[0])||null;
}
/* the top-level folder that holds everything */
async function driveFolder(){
  if(driveFolderId) return driveFolderId;
  const q=encodeURIComponent("name='"+driveQ(DRIVE_FOLDER)+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const j=await (await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id)&q='+q)).json();
  if(j.files&&j.files[0]) return (driveFolderId=j.files[0].id);
  const r=await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id',
    {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:DRIVE_FOLDER, mimeType:'application/vnd.google-apps.folder'})});
  return (driveFolderId=(await r.json()).id);
}
/* find-or-create a sub-folder. Looking up by name first means two devices
   racing to create the same folder end up sharing one, not making two. */
async function driveSubFolder(name,parentId){
  const q=encodeURIComponent("name='"+driveQ(name)+"' and mimeType='application/vnd.google-apps.folder' and '"+parentId+"' in parents and trashed=false");
  const j=await (await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id)&q='+q)).json();
  if(j.files&&j.files[0]) return j.files[0].id;
  const r=await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name, mimeType:'application/vnd.google-apps.folder', parents:[parentId]})});
  return (await r.json()).id;
}
/* מעקב אבני חן / trips / <שם הנסיעה> / certificates */
let _tripFolders=Object.create(null);
async function driveCertFolder(trip){
  const root=await driveFolder();
  if(!trip||!trip.name) return root;
  const key=trip.id+'|'+trip.name;                       // renaming the trip invalidates the cache
  if(_tripFolders[key]) return _tripFolders[key];
  const trips=await driveSubFolder(DRIVE_TRIPS,root);
  const one=await driveSubFolder(trip.name,trips);
  return (_tripFolders[key]=await driveSubFolder(DRIVE_CERTS,one));
}
/* ---- dated backups: מעקב אבני חן/backups/gemstones_YYYY-MM-DD.json ----
   Sync keeps exactly one copy – "now". These are the versioned history, so a
   mistake that syncs to both devices is still recoverable. */
let driveBackupDay=null;
async function driveBackupsFolder(){ return driveSubFolder(DRIVE_BACKUPS, await driveFolder()); }
async function driveBackupList(){
  if(!driveOn||driveNeedsAuth) return [];
  const parent=await driveBackupsFolder();
  const q=encodeURIComponent("'"+parent+"' in parents and trashed=false");
  const j=await (await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,name)&pageSize=100&q='+q)).json();
  return (j.files||[]).filter(f=>/^gemstones_\d{4}-\d{2}-\d{2}\.json$/.test(f.name||''))
    .map(f=>({id:f.id, day:f.name.slice(10,20)})).sort((a,b)=>b.day.localeCompare(a.day));
}
async function driveBackupRead(id){
  const txt=await (await driveFetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media')).text();
  const j=JSON.parse(txt); return j&&j.state?j.state:j;
}
/* one write per day per device – the day's file is overwritten, not appended to */
async function driveBackupToday(){
  if(!driveOn||driveNeedsAuth) return;
  const day=today(); if(driveBackupDay===day) return;
  const name='gemstones_'+day+'.json';
  const existing=await driveFindByName(name,'id');
  if(existing){
    await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+existing.id+'?uploadType=media&fields=id',
      {method:'PATCH', headers:{'Content-Type':'application/json; charset=UTF-8'}, body:drivePayload()});
  }else{
    const parent=await driveBackupsFolder(), b='gemBak'+Math.random().toString(36).slice(2);
    const body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'
      +JSON.stringify({name, parents:[parent]})
      +'\r\n--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+drivePayload()+'\r\n--'+b+'--';
    await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
      {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body});
  }
  driveBackupDay=day;
  const all=await driveBackupList();                       // newest first – drop anything past the keep window
  for(const old of all.slice(DRIVE_BACKUP_KEEP)){
    try{ await driveFetch('https://www.googleapis.com/drive/v3/files/'+old.id,{method:'DELETE'}); }catch(e){}
  }
}
/* find one of our files by name, wherever it sits; null when Drive never saw it.
   Reads stay name-based on purpose, so moving folders around can't break them. */
async function driveFindByName(name,fields){
  const q=encodeURIComponent("name='"+driveQ(name)+"' and trashed=false");
  const j=await (await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files('+(fields||'id')+')&q='+q)).json();
  return (j.files&&j.files[0])||null;
}
async function driveMoveTo(file,parentId){
  const from=(file.parents||[]).join(',');
  await driveFetch('https://www.googleapis.com/drive/v3/files/'+file.id+'?addParents='+parentId
    +(from?'&removeParents='+from:'')+'&fields=id',{method:'PATCH'});
}
/* ---- certificate photos ride along in the same folder ---- */
async function driveCertUpload(name,blob,trip){
  if(!driveOn||driveNeedsAuth||!blob) return;
  if(await driveFindByName(name)) return;                       // already up there
  const parent=await driveCertFolder(trip||activeTrip()), b='gemCert'+Math.random().toString(36).slice(2);
  const head='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'
    +JSON.stringify({name, parents:[parent]})+'\r\n--'+b+'\r\nContent-Type: '+(blob.type||'image/jpeg')+'\r\n\r\n';
  await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
    {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body:new Blob([head,blob,'\r\n--'+b+'--'])});
}
async function driveCertDownload(name){
  if(!driveOn||driveNeedsAuth) return null;
  const f=await driveFindByName(name); if(!f) return null;
  return (await driveFetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media')).blob();
}
async function driveCertDelete(name){
  if(!driveOn||driveNeedsAuth) return;
  const f=await driveFindByName(name); if(!f) return;
  await driveFetch('https://www.googleapis.com/drive/v3/files/'+f.id,{method:'DELETE'});
}
/* Put every photo where it belongs: upload the ones Drive never got, and move
   the ones sitting in the wrong folder (older versions dropped them all in the
   top-level folder, and renaming a trip renames its folder). */
const DRIVE_TIDY_V=2;                 // bump to re-run the tidy-up on every device
async function driveCertTidyOnce(){
  if(!driveOn||driveNeedsAuth) return;
  let done=null; try{ done=await idbGet('driveTidy'); }catch(e){}
  if(done===DRIVE_TIDY_V) return;     // this device already sorted its folders
  await driveCertBackfill();
  idbSet('driveTidy',DRIVE_TIDY_V).catch(()=>{});
}
async function driveCertBackfill(){
  if(!driveOn||driveNeedsAuth) return;
  const seen=Object.create(null);
  for(const t of (state.trips||[])){
    for(const v of (t.vendors||[])) for(const r of (v.rows||[])){
      const n=r.cert; if(!n||seen[n]) continue; seen[n]=1;      // a photo belongs to one trip
      try{
        const f=await driveFindByName(n,'id,parents');
        if(!f){ const b=await certImgGet(n); if(b) await driveCertUpload(n,b,t); continue; }
        const parent=await driveCertFolder(t);
        if((f.parents||[]).indexOf(parent)<0) await driveMoveTo(f,parent);
      }catch(e){}
    }
  }
}
async function driveCreateFile(){
  const b='gemBoundary'+Math.random().toString(36).slice(2), parent=await driveFolder();
  const body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'
    +JSON.stringify({name:DRIVE_FILENAME, mimeType:'application/json', parents:[parent]})
    +'\r\n--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+drivePayload()+'\r\n--'+b+'--';
  const r=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime,webViewLink',
    {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body});
  return r.json();
}
/* adopt the remote copy into the app */
function driveAdopt(s){
  state=migrateRows(s);
  if(!state.activeTripId) state.activeTripId=state.trips[0]&&state.trips[0].id;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  render();
}
async function drivePull(force){
  if(!driveOn||!driveFileId) return;
  const meta=await (await driveFetch('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?fields=modifiedTime')).json();
  if(!force && meta.modifiedTime===driveModified) return;              // nothing new on the other device
  const txt=await (await driveFetch('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?alt=media')).text();
  driveModified=meta.modifiedTime;
  const remote=txt.trim()?driveUnwrap(txt):null;
  if(!remote){ await drivePush(true); return; }                        // empty/foreign file: seed it
  if(!state.savedAt || (remote.savedAt||'')>state.savedAt){ driveAdopt(remote); renderDriveUI('synced'); }
  else if((remote.savedAt||'')<state.savedAt) await drivePush(true);   // ours is newer – put it back
}
function scheduleDrivePush(){
  if(!driveOn||driveNeedsAuth) return;
  clearTimeout(drivePushTimer); drivePushTimer=setTimeout(()=>drivePush().catch(()=>renderDriveUI('error')),1500);
}
async function drivePush(skipGuard){
  if(!driveOn||!driveFileId||driveBusy) return; driveBusy=true;
  try{
    if(!skipGuard&&driveModified){
      const meta=await (await driveFetch('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?fields=modifiedTime')).json();
      if(meta.modifiedTime!==driveModified){                           // another device wrote behind our back
        const txt=await (await driveFetch('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?alt=media')).text();
        const remote=txt.trim()?driveUnwrap(txt):null;
        driveModified=meta.modifiedTime;
        if(remote && (remote.savedAt||'')>(state.savedAt||'')){        // theirs is newer – never clobber it
          driveAdopt(remote); renderDriveUI('synced');
          alert('נטענו נתונים עדכניים יותר ממכשיר אחר ☁️');
          return;
        }
      }
    }
    const r=await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+driveFileId+'?uploadType=media&fields=id,modifiedTime',
      {method:'PATCH', headers:{'Content-Type':'application/json; charset=UTF-8'}, body:drivePayload()});
    driveModified=(await r.json()).modifiedTime;
    renderDriveUI('synced');
  }finally{ driveBusy=false; }
}
async function connectDrive(){
  if(!DRIVE_SUPPORTED){ alert('כדי לסנכרן צריך לפתוח את האפליקציה מהקישור באינטרנט (לא מקובץ שהורד למחשב).'); return; }
  try{
    await driveAuth(true);
    let f=await driveFindFile();
    if(!f) f=await driveCreateFile();
    driveFileId=f.id; driveModified=null; driveOn=true;
    driveLink=f.webViewLink||('https://drive.google.com/file/d/'+f.id+'/view');
    await idbSet('drive',{fileId:driveFileId, link:driveLink});
    await drivePull(true);
    renderDriveUI('synced');
    driveCertTidyOnce().catch(()=>{});
    driveBackupToday().catch(()=>{});
    alert('מחובר ל‑Google Drive ✓\n\nנוצרה ב"הדרייב שלי" תיקייה בשם "'+DRIVE_FOLDER+'", ובתוכה הקובץ '+DRIVE_FILENAME+' וגם תמונות התעודות.\nאפשר תמיד להגיע אליה מכפתור "📂 הצג ב‑Drive" שבתפריט.\n\nכדי לסנכרן גם את הטלפון: פותחים שם את אותו קישור ומתחברים לאותו חשבון Google.');
  }catch(e){
    driveOn=false; renderDriveUI();
    alert('לא הצלחנו להתחבר ל‑Google Drive.\n('+((e&&e.message)||e)+')');
  }
}
async function disconnectDrive(){
  if(!confirm('לנתק את הסנכרון עם Google Drive? הנתונים יישארו במכשיר וגם בקובץ שב‑Drive.')) return;
  driveOn=false; driveFileId=null; driveLink=''; driveFolderId=null; _tripFolders=Object.create(null);
  driveModified=null; driveToken=null; driveNeedsAuth=false;
  await idbDel('drive'); await idbDel('driveTok').catch(()=>{}); renderDriveUI();
}
function renderDriveUI(status){
  const el=$('driveUI'); if(!el) return; el.innerHTML='';
  if(!DRIVE_SUPPORTED){
    el.innerHTML='<span class="sync-chip" title="הסנכרון עובד רק כשפותחים את האפליקציה מהקישור באינטרנט">☁️ פתחו מהקישור כדי לסנכרן</span>';
    return;
  }
  if(driveOn&&!driveNeedsAuth){
    el.innerHTML=`<span class="sync-chip" title="הנתונים נשמרים אוטומטית לקובץ ${DRIVE_FILENAME} ב‑Google Drive שלך, ומסתנכרנים לכל מכשיר שמחובר לאותו חשבון.">${status==='error'?'⚠️':'☁️'} מסונכרן: <b>${DRIVE_FILENAME}</b></span>`;
    const o=document.createElement('button'); o.className='btn btn-ghost btn-sm'; o.textContent='📂 הצג ב‑Drive';
    o.title='פתיחת הקובץ gemstones.json ב‑Google Drive, בחלון חדש.'; o.onclick=()=>window.open(driveLink,'_blank','noopener');
    el.appendChild(o);
    const r=document.createElement('button'); r.className='btn btn-ghost btn-sm'; r.textContent='רענן';
    r.title='טעינת הנתונים העדכניים ביותר מ‑Drive, וסידור תמונות התעודות בתיקיות של הנסיעות.';
    r.onclick=()=>drivePull(true).then(()=>driveCertBackfill()).catch(()=>renderDriveUI('error'));
    const d=document.createElement('button'); d.className='btn btn-ghost btn-sm'; d.textContent='נתק'; d.onclick=disconnectDrive;
    el.appendChild(r); el.appendChild(d);
  }else if(driveOn&&driveNeedsAuth){
    const b=document.createElement('button'); b.className='btn btn-amber'; b.textContent='☁️ התחבר מחדש ל‑Google Drive';
    b.title='ההרשאה פגה. התחברות מחדש תטען את הנתונים העדכניים.'; b.onclick=connectDrive;
    el.appendChild(b);
  }else{
    const b=document.createElement('button'); b.className='btn btn-ghost'; b.textContent='☁️ סנכרן עם Google Drive';
    b.title='חיבור חד‑פעמי לחשבון Google. הנתונים יישמרו לקובץ אחד ב‑Drive שלך ויסתנכרנו בין המחשב לטלפון.';
    b.onclick=connectDrive; el.appendChild(b);
  }
}
async function initDrive(){
  renderDriveUI();
  if(!DRIVE_SUPPORTED) return;
  let saved=null; try{ saved=await idbGet('drive'); }catch(e){}
  if(!saved||!saved.fileId) return;
  driveFileId=saved.fileId; driveLink=saved.link||('https://drive.google.com/file/d/'+saved.fileId+'/view');
  driveOn=true; renderDriveUI('synced');
  // Reuse the token from last time if it is still alive. Asking Google for a new
  // one opens a popup, so doing it on every refresh looked like being logged out.
  try{ const tk=await idbGet('driveTok');
    if(tk&&tk.t&&tk.e>Date.now()){ driveToken=tk.t; driveTokenExp=tk.e; } }catch(e){}
  try{ if(!driveToken) await driveAuth(false); }
  catch(e){ driveToken=null; driveNeedsAuth=true; renderDriveUI(); return; }
  // a pull that fails is just a bad moment on the network – stay connected
  try{ await drivePull(true); renderDriveUI('synced'); }catch(e){ renderDriveUI('error'); }
  driveCertTidyOnce().catch(()=>{});      // sort the photos into their folders, once per device
  driveBackupToday().catch(()=>{});        // the day's version shouldn't wait for him to type something
}
/* pick up the other device's edits when he comes back to the app, and flush ours when he leaves */
document.addEventListener('visibilitychange',()=>{
  if(!driveOn||driveNeedsAuth) return;
  if(document.visibilityState==='visible') drivePull().catch(()=>{});
  else { clearTimeout(drivePushTimer); drivePush().catch(()=>{}); }
});
/* ...and keep checking while he's looking at it – otherwise a laptop left open
   on screen never notices what he just did on the phone. A pull is one cheap
   metadata call unless something actually changed. */
const DRIVE_POLL_MS=30000;
setInterval(()=>{
  if(driveOn&&!driveNeedsAuth&&!driveBusy&&document.visibilityState==='visible') drivePull().catch(()=>{});
},DRIVE_POLL_MS);

async function initSync(){
  initDrive();
  idbDel('syncHandle').catch(()=>{});          // drop the retired file-sync handle
  idbDel('backupDir').catch(()=>{});            // drop the retired backup-folder handle
}

let guideBuilt=false;
let currentView='tracker';

  currentView=view;
  const isTracker = view==='tracker';
  document.querySelector('.tripbar').style.display = isTracker ? '' : 'none';
  $('tabs').style.display = isTracker ? '' : 'none';
  $('main').style.display = isTracker ? '' : 'none';
  if(view==='preview') buildPreview();          // always rebuilt – data is live
  $('previewView').style.display = view==='preview' ? 'block' : 'none';
  if(view==='stats') buildStats();              // always rebuilt – data is live
  $('statsView').style.display = view==='stats' ? 'block' : 'none';
  // shown first, then built: the To box measures itself, and a hidden box measures 0
  $('shipView').style.display = view==='ship' ? 'block' : 'none';
  if(view==='ship') buildShipment();            // always rebuilt – totals are live
  if(view==='guide' && !guideBuilt){ buildGuide(); guideBuilt=true; }

/* ----- vendor statistics across all trips (by vendor name) ----- */
let statsSort='cost';
function aggregateVendorStats(){
  const map={};
  state.trips.forEach(t=>{
    t.vendors.forEach(v=>{
      const rows=v.rows.filter(hasData); if(!rows.length) return;
      const a = map[v.name] || (map[v.name]={name:v.name, code:vendorCode(v), trips:0, byTrip:[],
        boughtCount:0, cost:0, carat:0, stones:0});
      if(!a.code) a.code=vendorCode(v);
      let tCost=0,tCount=0,tCarat=0;
      rows.forEach(r=>{
        const rc=rowCost(r);
        a.boughtCount++; a.cost+=rc; a.carat+=num(r.weight); a.stones+=num(r.stones);
        tCount++; tCost+=rc; tCarat+=num(r.weight);
      });
      a.trips++;
      a.byTrip.push({name:t.name, date:t.date||'', count:tCount, cost:tCost, carat:tCarat});
    });
  });
  const list=Object.values(map);
  list.forEach(a=>{
    a.avgCostCarat=a.carat>0 ? a.cost/a.carat : 0;
    a.avgCostStone=a.boughtCount>0 ? a.cost/a.boughtCount : 0;
    a.byTrip.sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  });
  const sorters={ cost:(x,y)=>y.cost-x.cost, percarat:(x,y)=>y.avgCostCarat-x.avgCostCarat,
    carat:(x,y)=>y.carat-x.carat, stones:(x,y)=>y.boughtCount-x.boughtCount, trips:(x,y)=>y.trips-x.trips };
  list.sort(sorters[statsSort]||sorters.cost);
  return list;
}
function buildStats(){
  const list=aggregateVendorStats();
  const opt=(v,t)=>`<option value="${v}"${statsSort===v?' selected':''}>${t}</option>`;
  const head=`<div class="st-head-main"><h2>📊 סטטיסטיקת ספקים</h2>

  const cardsHtml=list.map((a,i)=>{

    const grid=[

      <span>עלות <b>${fmtMoney(b.cost)}</b> · ${fmtNum(b.count)} אבנים · ${fmtNum(b.carat)} קראט</span></div>`).join('');
    return `<div class="st-vendor">
      <div class="st-head"><span class="pv-vname">${escapeHtml(a.name)}${a.code?` <span class="vcode-badge">${escapeHtml(a.code)}</span>`:''}</span>
        ${i===0&&statsSort==='cost'?'<span class="st-top">⭐ הקנייה הגדולה</span>':''}</div>

        <div class="pv-stat"><div class="lbl">עלות ממוצעת לקראט</div><div class="num">${fmtMoney(a.avgCostCarat)}</div></div>
        <div class="pv-stat"><div class="lbl">סה"כ קראט</div><div class="num">${fmtNum(a.carat)}</div></div>

      <details class="st-time"><summary>לאורך זמן (${fmtNum(a.trips)} נסיעות)</summary>${time}</details>
    </div>`;
  }).join('');
  $('statsView').innerHTML=`<div class="stats-wrap">${head}${cardsHtml}</div>`;
}

    $('previewView').innerHTML=`<div class="pv">${headHtml}<div class="empty">עדיין אין נתונים בנסיעה הזו 💎</div></div>`;
    return;

  $('previewView').innerHTML=`

        <div class="pv-stat"><div class="lbl">סה"כ עלות</div><div class="num">${fmtMoney(gCost)}</div></div>
